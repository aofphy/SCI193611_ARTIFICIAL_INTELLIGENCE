# Markov decision processes

MDP หรือ **Markov decision process** คือพจน์ $(\mathcal{S}, \mathcal{A}, P, R)$ ดังนี้:
- $\mathcal{S}$ คือเซตของสถานะ $s$;
- $\mathcal{A}$ คือเซตของการกระทำ $a$;
- $P$ คือแบบจำลองการเปลี่ยนผ่าน (stationary transition model) โดยที่ $P(s'|s,a)$ แทนความน่าจะเป็นที่จะไปถึงสถานะ $s'$ เมื่อทำการกระทำ $a$ ในสถานะ $s$;
- $R$ คือฟังก์ชันรางวัลที่แมปไปยังรางวัลทันที (finite) $R(s)$ ที่ได้รับในสถานะ $s$.

## ตัวอย่าง

- $\mathcal{S}$: ตำแหน่ง $(i,j)$ บนกริด
- $\mathcal{A}$: $[\text{Up}, \text{Down}, \text{Right}, \text{Left}]$
- แบบจำลองการเปลี่ยนผ่าน: $P(s'|s,a)$
- รางวัล:
$$
R(s) = \begin{cases}
-0.3 & \text{สำหรับสถานะที่ไม่ใช่ปลายทาง (non-terminal states)} \\\\
\pm 1  & \text{สำหรับสถานะปลายทาง (terminal states)}
\end{cases}
$$

.footnote[เครดิต: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]

## อะไรคือ "Markovian" ของ MDPs?

ให้สถานะปัจจุบันกำหนด อนาคตและอดีตจะเป็นอิสระต่อกัน:
$$P(s\_{t+1} | s\_t, a\_t, s\_{t-1}, a\_{t-1}, ..., s\_0) = P(s\_{t+1} | s\_t, a\_t)$$
คล้ายกับปัญหาการค้นหา ที่ฟังก์ชันผู้สืบทอด (successor) ขึ้นอยู่แค่สถานะปัจจุบัน
]

## การลดค่า (Discounting)

- ทุกครั้งที่เราเปลี่ยนไปสถานะถัดไป เราคูณส่วนลดหนึ่งครั้ง

class: middle

## ลำดับอนันต์ (Infinite sequences)

ถ้าเอเยนต์มีชีวิตตลอดไป? เราจะได้รางวัลเป็นอนันต์หรือไม่? การเปรียบเทียบลำดับรางวัลที่มีอรรถประโยชน์เป็น $+\infty$ เป็นปัญหา

วิธีแก้:
- ขอบเขตเวลา (Finite horizon): (คล้าย depth-limited search)
    - จบตอนหลังจากจำนวนก้าวคงที่ $T$.
    - ทำให้ได้นโยบายที่ไม่ stationary ($\pi$ ขึ้นกับเวลาที่เหลือ)
- ส่วนลด (เมื่อ $0 < \gamma < 1$ และรางวัลมีขอบเขตโดย $\pm R\_\text{max}$):
    $$V([r\_0, r\_1, ..., r\_\infty]) = \sum\_{t=0}^{\infty} \gamma^t r\_t \leq \frac{R\_\text{max}}{1-\gamma}$$
  $\gamma$ เล็กลง ทำให้ขอบเขตเวลาสั้นลง
- สถานะดูดซับ (Absorbing state): รับประกันว่า สำหรับทุกนโยบาย จะไปถึงสถานะปลายทางในที่สุด

## การประเมินนโยบาย (Policy evaluation)

อรรถประโยชน์คาดหมายที่ได้จากการทำตาม $\pi$ โดยเริ่มจาก $s$ ให้โดย
$$V^\pi(s) = \mathbb{E}\left[\sum\_{t=0}^\infty \gamma^t R(s\_t) \right]\Biggr\rvert\_{s\_0=s}$$
โดยความคาดหมายคือเหนือการแจกแจงความน่าจะเป็นของลำดับสถานะซึ่งกำหนดโดย $s$ และ $\pi$.

.footnote[เครดิต: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]

---

class: middle

## นโยบายที่เหมาะสม (Optimal policies)

ในบรรดานโยบายทั้งหมดที่เอเยนต์สามารถทำได้ นโยบายที่เหมาะสมที่สุดคือ $\pi\_s$ ที่ทำให้คาดหมายอรรถประโยชน์สูงสุด:
$$\pi\_s = \arg \max\_\pi V^\pi(s)$$

เนื่องจากมีการลดค่า อรรถประโยชน์ นโยบายที่เหมาะสมจะ "ไม่ขึ้นกับ" สถานะเริ่มต้น $s$ (ดูภายหลัง) ดังนั้นเราจึงเขียนเพียง $\pi^*$

# ค่าอรรถประโยชน์ของสถานะ (Values of states)

อรรถประโยชน์ หรือค่า $V(s)$ ของสถานะ นิยามเป็น $V^{\pi^*}(s)$
- คือ รางวัล (แบบลดค่า) ที่คาดหวัง หากเอเยนต์ทำตามนโยบายที่เหมาะสมโดยเริ่มจาก $s$
- สังเกตว่า $R(s)$ และ $V(s)$ เป็นปริมาณที่ต่างกันมาก:
    - $R(s)$ คือรางวัลระยะสั้นสำหรับการไปถึง $s$
    - $V(s)$ คือรางวัลรวมระยะยาวจาก $s$ เป็นต้นไป

---

# สมการของ Bellman (The Bellman equation)

อรรถประโยชน์ของสถานะเท่ากับรางวัลทันทีของสถานะนั้น บวกกับอรรถประโยชน์ที่ถูกลดค่าคาดหมายของสถานะถัดไป โดยสมมติว่าเอเยนต์เลือกการกระทำที่เหมาะสม:
$$V(s) = R(s) + \gamma  \max\_{a} \sum\_{s'} P(s'|s,a) V(s').$$
- สมการเหล่านี้เรียกว่า **Bellman equations** เป็นระบบสมการไม่เชิงเส้น $n=|\mathcal{S}|$ สมการกับตัวแปรเท่ากัน
- อรรถประโยชน์ของสถานะ ซึ่งนิยามเป็นอรรถประโยชน์คาดหมายของลำดับสถานะถัดไป คือคำตอบของชุดสมการ Bellman

สมการ Bellman รวม Expected utility (สไลด์ก่อนหน้า) กับสมการสกัดนโยบาย

# Value iteration

เนื่องจากตัวดำเนินการ $\max$ ทำให้สมการ Bellman เป็นไม่เชิงเส้น การแก้ระบบสมการโดยตรงจึงเป็นปัญหา

อัลกอริทึม **value iteration** ให้กระบวนการเวียนกลับสู่จุดตรึง (fixed-point iteration) เพื่อคำนวณค่าอรรถประโยชน์ของสถานะ $V(s)$:
- ให้ $V\_i(s)$ เป็นค่าประมาณอรรถประโยชน์ของ $s$ ที่ขั้นตอนที่ $i$
- **Bellman update** คือการอัปเดตค่าประมาณทั้งหมดพร้อมกันให้ "สอดคล้องในเชิงเฉพาะที่" กับสมการ Bellman:
$$V\_{i+1}(s) := R(s) + \gamma \max\_a \sum\_{s'} P(s'|s,a) V\_i(s') $$
- ทำซ้ำจนลู่เข้า

---

class: middle

.center.width-50[![](../figures/lec8/value-iteration.png)]



เกณฑ์หยุดอิงกับข้อเท็จจริงว่า ถ้าการอัปเดตมีค่าน้อย แปลว่าความคลาดเคลื่อนก็เล็กด้วย คือถ้า
$$||V\_{i+1} - V\_i|| < \epsilon (1-\gamma)/\gamma$$
แล้วจะมี $$||V\_{i+1}-V||<\epsilon$$

## การลู่เข้า (Convergence)

ให้ $V\_i$ และ $V\_{i+1}$ เป็นค่าประมาณต่อเนื่องของค่าแท้จริง $V$.

.bold[ทฤษฎีบท.] สำหรับค่าประมาณสองตัว $V\_i$ และ $V'\_i$ ใดๆ,
$$||V\_{i+1} - V'\_{i+1}||\_\infty \leq \gamma ||V\_i - V'\_i||\_\infty.$$
- กล่าวคือ Bellman update เป็นการหด (contraction) ด้วยแฟกเตอร์ $\gamma$ บนปริภูมิเวกเตอร์อรรถประโยชน์
- ดังนั้นค่าประมาณใดๆ จะต้องเข้าใกล้กันเรื่อยๆ และโดยเฉพาะจะเข้าใกล้ $V$ จริง

$\Rightarrow$ Value iteration ลู่เข้าสู่คำตอบเอกลักษณ์ของสมการ Bellman เสมอเมื่อ $\gamma < 1$

---

class: middle

## สมรรถนะ (Performance)

เพราะว่า $||V\_{i+1} - V||\_\infty \leq \gamma ||V\_i - V||\_\infty$ ความคลาดเคลื่อนลดลงอย่างน้อยแฟกเตอร์ $\gamma$ ในแต่ละรอบ

ดังนั้น value iteration ลู่เข้าเร็วแบบเอ็กซ์โปเนนเชียล:
- คลาดเคลื่อนเริ่มต้นสูงสุด $||V\_0 - V||\_\infty \leq 2R\_\text{max} / (1-\gamma)$
- เพื่อให้คลาดเคลื่อนไม่เกิน $\epsilon$ หลัง $N$ รอบ ต้องมี $\gamma^N 2R\_\text{max}/(1-\gamma) \leq \epsilon$

## ปัญหาของ value iteration

Value iteration ทำ Bellman updates ซ้ำๆ:
$$V\_{i+1}(s) = R(s) + \gamma \max\_a \sum\_{s'} P(s'|s,a) V\_i(s') $$
- ปัญหา 1: ช้า – $O(|\mathcal{S}|^2 |\mathcal{A}|)$ ต่อรอบ
- ปัญหา 2: ค่า $\max$ ที่แต่ละสถานะ เปลี่ยนไม่บ่อย
- ปัญหา 3: นโยบาย $\pi\_i$ ที่สกัดจาก $V\_i$ อาจเหมาะสมแล้ว แม้ $V\_i$ ยังไม่แม่นยำ!

# Policy iteration

อัลกอริทึม **policy iteration** คำนวณนโยบายโดยตรง (แทนที่จะคำนวณค่าอรรถประโยชน์ของสถานะ) โดยสลับสองขั้นตอนนี้:
- การประเมินนโยบาย: เมื่อกำหนด $\pi\_i$ คำนวณ $V\_i = V^{\pi\_i}$ คืออรรถประโยชน์ของแต่ละสถานะหากทำตาม $\pi\_i$
- การปรับปรุงนโยบาย: คำนวณนโยบายใหม่ $\pi\_{i+1}$ ด้วยการมองไปข้างหน้า 1 ก้าว บนพื้นฐาน $V\_i$:
$$\pi\_{i+1}(s) = \arg\max\_a \sum\_{s'} P(s'|s,a)V\_i(s')$$

อัลกอริทึมนี้ยังคงให้คำตอบเหมาะสม และอาจลู่เข้าเร็วกว่าอย่างมากในบางกรณี

## การประเมินนโยบาย (Policy evaluation)

ที่รอบที่ $i$ เราได้เวอร์ชันง่ายของสมการ Bellman ที่เชื่อมค่าอรรถประโยชน์ของ $s$ กับของเพื่อนบ้าน:
$$V\_i(s)  = R(s) + \gamma \sum\_{s'} P(s'|s,\pi\_i(s)) V\_i(s')$$
สมการเหล่านี้ตอนนี้เป็น **เชิงเส้น** เพราะไม่มีตัวดำเนินการ $\max$ แล้ว
- สำหรับ $n$ สถานะ เรามี $n$ สมการ $n$ ตัวไม่ทราบค่า
- แก้ได้พอดีใน $O(n^3)$ ด้วยพีชคณิตเชิงเส้นมาตรฐาน
(*สังเกตว่าเราแทนที่ $a$ ด้วย $\pi\_i(s)$*)

---

class: middle

บางครั้ง $O(n^3)$ ก็แพงเกินไป โชคดีที่ไม่จำเป็นต้องประเมินนโยบายอย่างแม่นยำเสมอไป วิธีประมาณก็เพียงพอ

วิธีหนึ่งคือรันสมการ Bellman แบบง่าย $k$ รอบ:
$$V\_{i+1}(s) = R(s) + \gamma \sum\_{s'} P(s'|s,\pi\_i(s))V\_i(s') $$

อัลกอริทึมผสมนี้เรียกว่า **modified policy iteration**

# POMDPs

ถ้าสภาพแวดล้อม "สังเกตได้บางส่วน" (partially observable) ล่ะ?
- เอเยนต์ไม่รู้ว่าตนเองอยู่ในสถานะ $s$ ไหน
    - เพราะฉะนั้น ประเมิน $R(s)$ ของสถานะที่ไม่รู้ไม่ได้

- แทนที่จะเป็นเช่นนั้น เอเยนต์รับรู้สัญญาณ $e$ ผ่านแบบจำลองเซ็นเซอร์ $P(e|s)$ เพื่อใช้ให้เหตุผลเกี่ยวกับสถานะที่ไม่รู้ $s$

# Belief MDP

.bold[ทฤษฎีบท (Åström, 1965).] การกระทำที่เหมาะสมขึ้นกับ belief state ปัจจุบันของเอเยนต์เท่านั้น
- นโยบายที่เหมาะสมสามารถบรรยายได้ด้วยแมป $\pi^*(b)$ จาก belief ไปยังการกระทำ
- ไม่ขึ้นกับสถานะจริงที่เอเยนต์อยู่

กล่าวคือ POMDPs สามารถลดรูปเป็น MDP บนปริภูมิ belief-state ได้ โดยกำหนดแบบจำลองการเปลี่ยนผ่าน $P(b'|b,a)$ และฟังก์ชันรางวัล $\rho$ บน belief states

---

class: middle

ถ้า $b$ เป็น belief ก่อนหน้า และเอเยนต์ทำการกระทำ $a$ และรับรู้ $e$ แล้ว belief ใหม่เหนือ $S'$ คือ
$$b' = \alpha {\bf P}(e|S') \sum\_{s} {\bf P}(S'|s,a)b(s) = \alpha\, \text{forward}(b,a,e).$$

ดังนั้น
$$
\begin{aligned}
P(b'|b,a) &= \sum\_e P(b',e|b,a)\\\\
&= \sum\_e P(b'|b,a,e) P(e|b,a) \\\\
&= \sum\_e P(b'|b,a,e) \sum\_{s'} P(e|b,a,s') P(s'|b,a) \\\\
&= \sum\_e P(b'|b,a,e) \sum\_{s'} P(e|s') \sum\_{s} P(s'|s,a) b(s)
\end{aligned}
$$

โดยที่ $P(b'|b,a,e)=1$ ถ้า $b'=\text{forward}(b,a,e)$ และเป็น $0$ มิฉะนั้น

---

เรายังกำหนดฟังก์ชันรางวัลสำหรับ belief state ได้เป็นรางวัลคาดหมายเหนือสถานะจริงที่เอเยนต์อาจอยู่:
$$\rho(b) = \sum\_{s} b(s) R(s)$$

# เอเยนต์แบบออนไลน์ (Online agents)

แม้จะยากที่จะหา $\pi^*$ โดยตรง เอเยนต์เชิงทฤษฎีการตัดสินใจ (decision-theoretic agent) สำหรับ POMDPs สร้างได้ดังนี้:
- แบบจำลองการเปลี่ยนผ่านและเซ็นเซอร์แทนด้วย *dynamic Bayesian network*
- ขยายเครือข่ายด้วยโหนดการตัดสินใจ ($A$) และอรรถประโยชน์/รางวัล ($R$, $U$) ให้เป็น dynamic decision network
- ใช้อัลกอริทึม **filtering** รวมหลักฐานและการกระทำใหม่เพื่ออัปเดต belief state
- ตัดสินใจโดยจำลองไปข้างหน้าสำหรับลำดับการกระทำที่เป็นไปได้และเลือกอันที่ดีที่สุด (โดยประมาณ) คล้าย *Expectiminimax* แบบตัดความลึก

- คลี่เครือข่ายออกสำหรับขอบเขตเวลาจำกัด
- รวมโหนดรางวัลของ $\mathbf{X}\_{t+1}$ และ $\mathbf{X}\_{t+2}$ แต่ใช้ (ค่าประมาณ) อรรถประโยชน์ของ $\mathbf{X}\_{t+3}$

- โหนดสามเหลี่ยมแต่ละอันคือ belief state ที่เอเยนต์ตัดสินใจ
    - belief state ที่แต่ละโหนดคำนวณได้โดยใช้การกรอง (filtering) กับลำดับของการรับรู้และการกระทำที่นำไปถึงโหนดนั้น
- โหนดวงกลมคือการสุ่มเลือกโดยสภาพแวดล้อม

การตัดสินใจสกัดได้จากต้นไม้ค้นหาโดยแบ็คอัปอรรถประโยชน์ (ประมาณ) จากใบ ขณะที่โหนดโอกาสใช้ค่าเฉลี่ย และโหนดตัดสินใจใช้ค่าสูงสุด

# สรุป (Summary)

- ปัญหาการตัดสินใจตามลำดับในสภาพแวดล้อมที่ไม่แน่นอน (MDPs) นิยามด้วยแบบจำลองการเปลี่ยนผ่านและฟังก์ชันรางวัล
- อรรถประโยชน์ของลำดับสถานะคือผลรวมของรางวัลทั้งหมดในลำดับ อาจมีการลดค่าตามเวลา
    - คำตอบของ MDP คือ นโยบายที่กำหนดการตัดสินใจสำหรับทุกสถานะที่เอเยนต์อาจเจอ
    - นโยบายที่เหมาะสมทำให้อรรถประโยชน์ของลำดับสถานะที่พบเมื่อทำตามนโยบายสูงสุด
- Value iteration และ Policy iteration ใช้แก้ MDP ได้ทั้งคู่
- POMDPs ยากกว่า MDPs มาก อย่างไรก็ดี เราสร้างเอเยนต์เชิงทฤษฎีการตัดสินใจสำหรับสภาพแวดล้อมเหล่านี้ได้
