# Markov Models

## แบบจำลองที่พิจารณาความเปลี่ยนแปลงตามเวลา

---

class: middle

## การจำลองการเปลี่ยนแปลงของเวลา

เราจะพิจารณาโลกเป็น *ชุดเวลาแบบไม่ต่อเนื่อง (discrete time slices)* โดยแต่ละช่วงเวลาจะประกอบด้วยตัวแปรสุ่ม:

- $\mathbf{X}\_t$ หมายถึงชุดของ **ตัวแปรสถานะที่ไม่สามารถสังเกตได้** ณ เวลา $t$
- $\mathbf{E}\_t$ หมายถึงชุดของ *ตัวแปรหลักฐานที่สังเกตได้* ณ เวลา $t$

### แผนผังแสดงความสัมพันธ์ตามเวลา

```
เวลา:    t=0      t=1      t=2      t=3    ...
สถานะ:   X₀  →    X₁  →    X₂  →    X₃    ...
         ↓        ↓        ↓        ↓
หลักฐาน:          E₁       E₂       E₃    ...
```

---

class: middle

## ส่วนประกอบของ Markov Model

เราต้องระบุ:

1. **Prior distribution** ${\bf P}(\mathbf{X}\_0)$
   - กำหนดสถานะความเชื่อเริ่มต้นเกี่ยวกับตัวแปรสถานะที่ซ่อนอยู่

2. **Transition model** ${\bf P}(\mathbf{X}\_t | \mathbf{X}\_{0:t-1})$ (สำหรับ $t > 0$)
   - กำหนดการแจกแจงความน่าจะเป็นของตัวแปรสถานะล่าสุด จากค่าก่อนหน้า

3. **Sensor model** ${\bf P}(\mathbf{E}\_t | \mathbf{X}\_{0:t}, \mathbf{E}\_{0:t-1})$ (สำหรับ $t > 0$)
   - กำหนดการแจกแจงความน่าจะเป็นของตัวแปรหลักฐานล่าสุด จากค่าที่ผ่านมาทั้งหมด

---

# Markov Processes

## สมมติฐาน Markov (Markov Assumption)

สถานะปัจจุบันของโลกขึ้นอยู่กับสถานะก่อนหน้าเพียงเล็กน้อยเท่านั้น กล่าวคือ $\mathbf{X}\_t$ ขึ้นอยู่กับเซตย่อยที่จำกัดของ $\mathbf{X}\_{0:t-1}$

กระบวนการสุ่มที่เป็นไปตามสมมติฐานนี้เรียกว่า **Markov processes** หรือ **Markov chains**

## First-order Markov Processes

กระบวนการ Markov ที่มีคุณสมบัติ:

${\bf P}(\mathbf{X}\_t | \mathbf{X}\_{0:t-1}) = {\bf P}(\mathbf{X}\_t | \mathbf{X}\_{t-1})$

หมายความว่า $\mathbf{X}\_t$ และ $\mathbf{X}\_{0:t-2}$ เป็นอิสระเมื่อกำหนดค่า $\mathbf{X}\_{t-1}$

<br>
.center.width-100[![](../figures/lec6/markov-process.png)]

---

class: middle

## Sensor Markov Assumption

เราสร้างสมมติฐาน **sensor Markov assumption** (อันดับหนึ่ง):

$${\bf P}(\mathbf{E}\_t | \mathbf{X}\_{0:t}, \mathbf{E}\_{0:t-1}) = {\bf P}(\mathbf{E}\_t | \mathbf{X}\_{t})$$

**ความหมาย**: ข้อมูลที่สังเกตได้ในปัจจุบันขึ้นอยู่กับสถานะปัจจุบันเท่านั้น

## สมมติฐาน Stationarity

**Transition model** และ **sensor model** จะเหมือนกันสำหรับทุก $t$ 

*กฎฟิสิกส์ไม่เปลี่ยนแปลงตามเวลา*

# การแจกแจงร่วม (Joint Distribution)

<br>
.center.width-100[![](../figures/lec6/smoothing-dbn.svg)]
<br>

**Markov chain** ที่รวมกับ **sensor model** สามารถแสดงเป็น *Bayesian network ที่ขยายได้* ซึ่งกางออกไปตามเวลาอนันต์

**การแจกแจงร่วม** ของตัวแปรทั้งหมดจนถึงเวลา $t$ คือ:

$${\bf P}(\mathbf{X}\_{0:t}, \mathbf{E}\_{1:t}) = {\bf P}(\mathbf{X}\_{0}) \prod\_{i=1}^t {\bf P}(\mathbf{X}\_{i} | \mathbf{X}\_{i-1}) {\bf P}(\mathbf{E}\_{i}|\mathbf{X}\_{i})$$

# งานการ Inference
## ประเภทของการ Inference
1. **Prediction** (การทำนาย): ${\bf P}(\mathbf{X}\_{t+k}| \mathbf{e}\_{1:t})$ สำหรับ $k>0$
   - คำนวณการแจกแจงความน่าจะเป็นของสถานะในอนาคต
   - ใช้สำหรับประเมินลำดับการกระทำที่เป็นไปได้

2. **Filtering**: ${\bf P}(\mathbf{X}\_{t}| \mathbf{e}\_{1:t})$
   - การติดตามสถานะปัจจุบันที่ซ่อนอยู่ $\mathbf{X}\_t$ (**belief state**)
   - สิ่งที่ rational agent ทำเพื่อตัดสินใจอย่างมีเหตุผล

3. **Smoothing**: ${\bf P}(\mathbf{X}\_{k}| \mathbf{e}\_{1:t})$ สำหรับ $0 \leq k < t$
   - คำนวณการแจกแจงความน่าจะเป็นของสถานะในอดีต
   - ใช้สร้างการประมาณที่ดีกว่า เนื่องจากรวมหลักฐานมากขึ้น
   - จำเป็นสำหรับการเรียนรู้

4. **Most likely explanation**: $\arg \max\_{\mathbf{x}\_{1:t}} P(\mathbf{x}\_{1:t}| \mathbf{e}\_{1:t})$
   - ใช้ในการถอดรหัส (decoding) ช่องทางสัญญาณรบกวน, การรู้จำเสียงพูด ฯลฯ

# กรณีฐาน (Base Cases)

.grid[
.kol-1-2.center[
.width-80[![](../figures/lec6/base-case2.png)]

### การทำนาย (Prediction)

$\begin{aligned}
{\bf P}(\mathbf{X}\_2) &= \sum\_{\mathbf{x}\_1} {\bf P}(\mathbf{X}\_2, \mathbf{x}\_1) \\\\
&= \sum\_{\mathbf{x}\_1} P(\mathbf{x}\_1) {\bf P}(\mathbf{X}\_2 | \mathbf{x}\_1)
\end{aligned}$

**ขั้นตอน**: ส่ง ${\bf P}(\mathbf{X}\_1)$ ข้างหน้าผ่าน transition model
]
.kol-1-2.center[
.width-80[![](../figures/lec6/base-case1.png)]

### การปรับปรุง (Update)

$\begin{aligned}
{\bf P}(\mathbf{X}\_1 | \mathbf{e}\_1) &=\frac{ {\bf P}(\mathbf{e}\_1 | \mathbf{X}\_1) {\bf P}(\mathbf{X}\_1)}{P(\mathbf{e}\_1)} \\\\
&\propto {\bf P}(\mathbf{e}\_1 | \mathbf{X}\_1) {\bf P}(\mathbf{X}\_1)
\end{aligned}$

**ขั้นตอน**: ปรับปรุง ${\bf P}(\mathbf{X}\_1)$ ด้วยหลักฐาน $\mathbf{e}\_1$ โดยใช้ sensor model
]
]

# การทำนาย (Prediction)

.center.width-50[![](../figures/lec6/stationary-cartoon.png)]

เพื่อทำนายอนาคต ${\bf P}(\mathbf{X}\_{t+k}| \mathbf{e}\_{1:t})$:
---
### ขั้นตอนการทำนาย

1. **ส่งต่อ (Push)** สถานะความเชื่อก่อนหน้า ${\bf P}(\mathbf{X}\_{t} | \mathbf{e}\_{1:t})$ ผ่าน transition model:

${\bf P}(\mathbf{X}\_{t+1}|\mathbf{e}\_{1:t}) = \sum\_{\mathbf{x}\_{t}} {\bf P}(\mathbf{X}\_{t+1} | \mathbf{x}\_{t}) P(\mathbf{x}\_{t} | \mathbf{e}\_{1:t})$

2. **ทำซ้ำ** จนถึง $t+k$ โดยใช้ ${\bf P}(\mathbf{X}\_{t+k-1}| \mathbf{e}\_{1:t})$ ในการคำนวณ ${\bf P}(\mathbf{X}\_{t+k}| \mathbf{e}\_{1:t})$

### หลักการ
- ยิ่งไกลในอนาคต → ความไม่แน่นอนมากขึ้น
- ไม่มีหลักฐานใหม่ → การแจกแจงกระจายออก

.footnote[เครดิต: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]

# การแจกแจงคงที่ (Stationary Distributions)

## จะเกิดอะไรขึ้นเมื่อ $t \to \infty$?

- สำหรับ chain ส่วนใหญ่ อิทธิพลของการแจกแจงเริ่มต้นจะลดลงเรื่อยๆ ตามเวลา
- ในที่สุด การแจกแจงจะเข้าสู่จุดคงที่ เรียกว่า **stationary distribution**
- การแจกแจงนี้มีคุณสมบัติ:

$${\bf P}(\mathbf{X}\_\infty) = {\bf P}(\mathbf{X}\_{\infty+1}) = \sum\_{\mathbf{x}\_\infty} {\bf P}(\mathbf{X}\_{\infty+1} | \mathbf{x}\_\infty) P(\mathbf{x}\_\infty)$$

### ความหมาย
- การแจกแจงไม่เปลี่ยนแปลงอีกต่อไป
- เป็นสมดุลระยะยาว (Long-term equilibrium)
- ไม่ขึ้นกับสถานะเริ่มต้น

---

class: middle

## ตัวอย่างการคำนวณ Stationary Distribution

### ตารางการเปลี่ยนผ่านสภาพอากาศ

| $\mathbf{X}\_{t-1}$ | $\mathbf{X}\_{t}$ | $P$ |
| --- | --- | --- |
| แดด | แดด | 0.9 |
| แดด | ฝน | 0.1 |
| ฝน | แดด | 0.3 |
| ฝน | ฝน | 0.7 |

### การแก้สมการ

$\begin{aligned}
P(\mathbf{X}\_\infty = \text{แดด}) =&\, P(\mathbf{X}\_{\infty+1} = \text{แดด}) \\\\
=&\, P(\mathbf{X}\_{\infty+1}=\text{แดด} | \mathbf{X}\_{\infty}=\text{แดด}) P(\mathbf{X}\_{\infty}=\text{แดด})\\\\
 & + P(\mathbf{X}\_{\infty+1}=\text{แดด} | \mathbf{X}\_{\infty}=\text{ฝน}) P(\mathbf{X}\_{\infty}=\text{ฝน})\\\\
=&\, 0.9 P(\mathbf{X}\_{\infty}=\text{แดด}) + 0.3 P(\mathbf{X}\_{\infty}=\text{ฝน})
\end{aligned}$

**ผลลัพธ์**: $P(\mathbf{X}\_\infty=\text{แดด}) = 3 P(\mathbf{X}\_\infty=\text{ฝน})$

เนื่องจาก $P(\text{แดด}) + P(\text{ฝน}) = 1$
- $P(\mathbf{X}\_\infty=\text{แดด}) = 0.75$
- $P(\mathbf{X}\_\infty=\text{ฝน}) = 0.25$

# อัลกอริทึม Forward Algorithm

การคำนวณ ${\bf P}(\mathbf{X}\_t | \mathbf{e}\_{1:t})$ แบบเวียนเกิด (recursive):

### ขั้นตอน Predict (ทำนาย)
$${\bf P}(\mathbf{X}\_{t+1} | \mathbf{e}\_{1:t}) = \sum\_{\mathbf{x}\_t} {\bf P}(\mathbf{X}\_{t+1} | \mathbf{x}\_t) P(\mathbf{x}\_t | \mathbf{e}\_{1:t})$$

### ขั้นตอน Update (ปรับปรุง)
$${\bf P}(\mathbf{X}\_{t+1} | \mathbf{e}\_{1:t+1}) \propto {\bf P}(\mathbf{e}\_{t+1} | \mathbf{X}\_{t+1}) {\bf P}(\mathbf{X}\_{t+1} | \mathbf{e}\_{1:t})$$

### ลำดับการทำงาน
1. เริ่มจาก ${\bf P}(\mathbf{X}\_0)$ (prior)
2. สำหรับแต่ละ $t$:
   - **Predict**: คำนวณ ${\bf P}(\mathbf{X}\_t | \mathbf{e}\_{1:t-1})$
   - **Update**: คำนวณ ${\bf P}(\mathbf{X}\_t | \mathbf{e}\_{1:t})$

# Hidden Markov Models

**Hidden Markov Model** คือ Markov chain ที่:
- **สถานะ** $\mathbf{X}\_t$ ไม่สามารถสังเกตได้โดยตรง (hidden)
- **การสังเกต** $\mathbf{E}\_t$ สามารถมองเห็นได้ และขึ้นอยู่กับสถานะ

### องค์ประกอบของ HMM

1. **States** $\mathbf{X}\_t \in \\{s\_1, s\_2, ..., s\_n\\}$
   - สถานะที่ซ่อนอยู่ $n$ สถานะ

2. **Observations** $\mathbf{E}\_t \in \\{o\_1, o\_2, ..., o\_m\\}$
   - การสังเกตที่มองเห็นได้ $m$ รูปแบบ

3. **Transition probabilities** $A\_{ij} = P(X\_{t+1}=s\_j | X\_t=s\_i)$
   - ความน่าจะเป็นการเปลี่ยนสถานะ
---
# Hidden Markov Models

**Hidden Markov Model** คือ Markov chain ที่:
- **สถานะ** $\mathbf{X}\_t$ ไม่สามารถสังเกตได้โดยตรง (hidden)
- **การสังเกต** $\mathbf{E}\_t$ สามารถมองเห็นได้ และขึ้นอยู่กับสถานะ

### องค์ประกอบของ HMM (ต่อ)
 4. **Emission probabilities** $B\_{jk} = P(E\_t=o\_k | X\_t=s\_j)$
   - ความน่าจะเป็นการสังเกตในแต่ละสถานะ

 5. **Initial probabilities** $\pi\_i = P(X\_0=s\_i)$
   - ความน่าจะเป็นเริ่มต้น

# Filters (ตัวกรอง)

## เครื่องมือสำหรับการติดตามสถานะ

# Kalman Filter

**Kalman Filter** เป็น optimal filter สำหรับระบบ linear Gaussian:

### สมมติฐาน
- **สถานะ**: ตัวแปรต่อเนื่อง (continuous variables)
- **Transition model**: linear transformation + Gaussian noise
- **Sensor model**: linear transformation + Gaussian noise

### สมการ Kalman Filter

.grid[
.kol-1-2[
**Predict step (การทำนาย)**:

$$\hat{\mathbf{x}}\_{t|t-1} = \mathbf{F}\_t \hat{\mathbf{x}}\_{t-1|t-1}$$

$$\mathbf{P}\_{t|t-1} = \mathbf{F}\_t \mathbf{P}\_{t-1|t-1} \mathbf{F}\_t^T + \mathbf{Q}\_t$$

**โดยที่**:
- $\mathbf{F}\_t$ = transition matrix
- $\mathbf{Q}\_t$ = process noise covariance
]
.kol-1-2[
**Update step (การปรับปรุง)**:

$$\mathbf{K}\_t = \mathbf{P}\_{t|t-1} \mathbf{H}\_t^T (\mathbf{H}\_t \mathbf{P}\_{t|t-1} \mathbf{H}\_t^T + \mathbf{R}\_t)^{-1}$$

$$\hat{\mathbf{x}}\_{t|t} = \hat{\mathbf{x}}\_{t|t-1} + \mathbf{K}\_t (\mathbf{z}\_t - \mathbf{H}\_t \hat{\mathbf{x}}\_{t|t-1})$$

$$\mathbf{P}\_{t|t} = (\mathbf{I} - \mathbf{K}\_t \mathbf{H}\_t) \mathbf{P}\_{t|t-1}$$

**โดยที่**:
- $\mathbf{H}\_t$ = observation matrix  
- $\mathbf{R}\_t$ = measurement noise covariance
- $\mathbf{K}\_t$ = Kalman gain
]
]

---

## ตัวอย่าง Kalman Filter: การติดตามวัตถุ

### สถานการณ์: ติดตามรถยนต์ด้วย GPS

.grid[
.kol-1-2[
**สถานะ (State)**:
- ตำแหน่ง $(x, y)$
- ความเร็ว $(v\_x, v\_y)$

**การสังเกต (Observation)**:
- GPS readings (มี noise)
- ความเร็วจาก speedometer
]
.kol-1-2[
**แบบจำลอง**:
$$\mathbf{x}\\_t = \begin{bmatrix} x \\ y \\ v\\_x \\ v\\_y \end{bmatrix}\\_t$$

**Transition matrix**:
$$\mathbf{F} = \begin{bmatrix} 
1 & 0 & \Delta t & 0 \\
0 & 1 & 0 & \Delta t \\
0 & 0 & 1 & 0 \\
0 & 0 & 0 & 1
\end{bmatrix}$$
]
]

### ข้อดีของ Kalman Filter
- **Optimal** สำหรับระบบ linear Gaussian
- **คำนวณเร็ว** (complexity เป็น $O(n^3)$)
- **ใช้หน่วยความจำน้อย** (เก็บแค่ state และ covariance)

# Particle Filter

**Particle Filter** ใช้สำหรับกรณีที่ไม่ใช่ linear/Gaussian:

### หลักการ
- ใช้ **particles** (samples) เป็นตัวแทนการแจกแจงความน่าจะเป็น
- แต่ละ particle คือสถานะที่เป็นไปได้หนึ่งสถานะ
- จำนวน particles ในแต่ละพื้นที่แสดงความน่าจะเป็น

### ขั้นตอนการทำงาน

1. **Initialization**: สร้าง N particles จาก prior distribution

2. **Prediction**: เลื่อน particles ตาม transition model
   ```
   สำหรับแต่ละ particle i:
     x_t^(i) = sample จาก P(X_t | x_{t-1}^(i))
   ```

3. **Update**: คำนวณ weight จากความน่าจะเป็นของการสังเกต
   ```
   สำหรับแต่ละ particle i:
     w_t^(i) = P(e_t | x_t^(i))
   ```

4. **Resampling**: เลือก particles ใหม่ตาม weights

# การเปรียบเทียบ Filters

| | **Kalman Filter** | **Particle Filter** |
|---|---|---|
| **ประเภทสถานะ** | Continuous | Discrete/Continuous |
| **Transition Model** | Linear + Gaussian | ใดก็ได้ |
| **Sensor Model** | Linear + Gaussian | ใดก็ได้ |
| **การแสดง Belief** | Gaussian (μ, Σ) | Set of particles |
| **ความแม่นยำ** | Optimal (หากสมมติฐานถูก) | Approximate |
| **ความเร็ว** | เร็วมาก O(n³) | ช้ากว่า O(N×n) |
| **หน่วยความจำ** | น้อย O(n²) | มาก O(N×n) |
| **ความยืดหยุ่น** | จำกัด | สูงมาก |

### เมื่อไหร่ใช้อะไร?
- **Kalman**: ระบบ linear, Gaussian, ต้องการความเร็ว
- **Particle**: ระบบ nonlinear, non-Gaussian, ต้องการความยืดหยุ่น

# สรุปสำคัญ

## แนวคิดหลัก

1. **Markov Assumption**: อนาคตขึ้นอยู่กับปัจจุบัน ไม่ใช่อดีต
2. **Belief State**: การรักษาความน่าจะเป็นของสถานะที่เป็นไปได้
3. **Predict-Update Cycle**: วงจรการทำนายและปรับปรุง

## เครื่องมือสำคัญ

- **Hidden Markov Models**: สำหรับระบบ discrete states
- **Kalman Filter**: สำหรับระบบ linear Gaussian
- **Particle Filter**: สำหรับระบบทั่วไป non-linear/non-Gaussian

## การประยุกต์

- การติดตามวัตถุ (Object tracking)
- การระบุตำแหน่ง (Localization) 
- การรู้จำรูปแบบ (Pattern recognition)
- การควบคุมระบบ (Control systems)
