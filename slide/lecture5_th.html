class: middle

การแทนค่าการแจกแจงความน่าจะเป็นร่วม (joint probability distribution) อย่างชัดเจน จะมีขนาดเพิ่มขึ้นแบบทวีคูณ (exponentially) ตามจำนวนตัวแปร

สมมติฐานเรื่อง *ความเป็นอิสระ (Independence)* และ *ความเป็นอิสระแบบมีเงื่อนไข (conditional independence)* ช่วยลดจำนวนความน่าจะเป็นที่ต้องกำหนด เราสามารถแทนความสัมพันธ์เหล่านี้ได้อย่างชัดเจนในรูปแบบของ **โครงข่ายเบย์ (Bayesian network)**

# โครงข่ายเบย์ (Bayesian networks)
.grid[
.kol-3-4[
โครงข่ายเบย์ คือ .bold[กราฟมีทิศทางที่ไม่มีวงจร (directed acyclic graph)] โดยที่
- แต่ละ **โหนด (node)** แทนตัวแปรสุ่ม (random variable) 
    - ซึ่งอาจจะสังเกตได้ (observed) หรือสังเกตไม่ได้ (unobserved)
    - และอาจเป็นได้ทั้งแบบไม่ต่อเนื่อง (discrete) หรือต่อเนื่อง (continuous)
- แต่ละ **เส้นเชื่อม (edge)** จะมีทิศทางและบ่งชี้ถึงความสัมพันธ์เชิงความน่าจะเป็นโดยตรงระหว่างสองตัวแปร
- แต่ละโหนด $X_i$ จะถูกกำกับด้วย *การแจกแจงความน่าจะเป็นแบบมีเงื่อนไข (conditional probability distribution)* $${\bf P}(X_i | \text{parents}(X_i))$$ ซึ่งกำหนดการแจกแจงของ $X_i$ เมื่อกำหนดค่าของโหนดพ่อแม่ (parents) ของมันในโครงข่าย

]

# ความหมาย (Semantics)

โครงข่ายเบย์เข้ารหัสการแจกแจงความน่าจะเป็นร่วมทั้งหมด *(full joint distribution)* โดยปริยาย ในรูปแบบผลคูณของการแจกแจงเฉพาะที่ (local distributions) นั่นคือ

$$P(x_1, ..., x_n) = \prod_{i=1}^n P(x_i | \text{parents}(X_i))$$

**การพิสูจน์:**
- จากกฎลูกโซ่ (chain rule), $P(x_1, ..., x_n) = \prod_{i=1}^n P(x_i | x_1, ..., x_{i-1})$
- หากเราตั้งสมมติฐานว่า $X_i$ เป็นอิสระแบบมีเงื่อนไข (conditionally independent) จากโหนดรุ่นก่อนหน้าในลำดับที่กำหนด เมื่อให้ค่าของโหนดพ่อแม่ และกำหนดให้ $\text{parents}(X_i) \subseteq \{ X_1, ..., X_{i-1}\}$ เราจะได้ว่า
$P(x_i | x_1, ..., x_{i-1}) = P(x_i | \text{parents}(X_i))$
- ดังนั้น, $P(x_1, ..., x_n) = \prod_{i=1}^n P(x_i | \text{parents}(X_i))$

$$

 P(j, m, a, \lnot b, \lnot e) &= P(j|a) P(m|a)P(a|\lnot b,\lnot e)P(\lnot b)P(\lnot e)\\ 
 &= 0.9 \times 0.7 \times 0.001 \times 0.999 \times 0.998 \\ 
 &\approx 0.00063
\end{aligned}
$$

# การสร้าง (Construction)

เราสามารถสร้างโครงข่ายเบย์โดยใช้ลำดับของตัวแปรแบบใดก็ได้ ตราบใดที่ยังเคารพสมมติฐานความเป็นอิสระแบบมีเงื่อนไข

## อัลกอริทึม

1. เลือก **ลำดับ (ordering)** ของตัวแปร $X_1, ..., X_n$
2. สำหรับ $i=1$ ถึง $n$:
    1. เพิ่ม $X_i$ เข้าไปในเครือข่าย
    2. เลือกเซตของโหนดพ่อแม่ (parents) ที่เล็กที่สุดจาก $X_1, ..., X_{i-1}$ ที่ทำให้ $P(x_i | x_1, ..., x_{i-1}) = P(x_i | \text{parents}(X_i))$
    3. สำหรับพ่อแม่แต่ละโหนด ให้ลากเส้นเชื่อมจากพ่อแม่ไปยัง $X_i$
    4. สร้างตาราง CPT (Conditional Probability Table)

.question[โครงข่ายทั้งสองนี้แทนการแจกแจงเดียวกันหรือไม่? และมีความกระชับ (compact) เท่ากันหรือไม่?]

---

สำหรับโครงข่ายด้านซ้าย:
- P(J|M) = P(J)? ไม่
- P(A|J, M) = P(A|J)? P(A|J, M) = P(A)? ไม่
- P(B|A, J, M) = P(B|A)? ใช่
- P(B|A, J, M) = P(B)? ไม่
- P(E|B, A, J, M) = P(E|A)? ไม่
- P(E|B, A, J, M) = P(E|A, B)? ใช่

โครงข่ายด้านขวา (โครงข่ายเดิม) มีความกระชับกว่ามาก เพราะต้องการพารามิเตอร์ใน CPT น้อยกว่า

## แนวคิดเบื้องหลัง d-separation

d-separation (ย่อมาจาก direction-dependent separation) เป็นวิธีการตรวจสอบว่ากลุ่มของตัวแปร $X$ เป็นอิสระแบบมีเงื่อนไข (conditionally independent) จากกลุ่มของตัวแปร $Y$ หรือไม่ เมื่อกำหนดกลุ่มของตัวแปรที่เป็นหลักฐาน (evidence) $Z$ ให้

แนวคิดหลักคือการพิจารณา **เส้นทาง (path)** ทั้งหมดระหว่างโหนดใน $X$ และโหนดใน $Y$
- หากทุกเส้นทางถูก **'ปิดกั้น' (blocked)** โดยหลักฐาน $Z$ เราจะสรุปได้ว่า $X$ และ $Y$ เป็นอิสระจากกันเมื่อมี $Z$
- หากมีอย่างน้อยหนึ่งเส้นทางที่ **'เปิด' (active)** แสดงว่าอิทธิพลอาจส่งผ่านได้ และเราไม่สามารถรับประกันความเป็นอิสระได้

เส้นทางจะถูกพิจารณาว่าเป็น 'active' (ข้อมูลไหลผ่านได้) หรือ 'inactive' (ถูกปิดกั้น) ขึ้นอยู่กับโครงสร้างของเส้นทางและโหนดหลักฐานที่อยู่บนเส้นทางนั้น

# การอนุมานโดยการแจกแจง (Inference by enumeration)

เริ่มต้นจากการแจกแจงร่วม ${\bf P}(Q, E_1, ..., E_k, H_1, ..., H_r)$
(Q: Query, E: Evidence, H: Hidden)

1.  เลือกเฉพาะรายการที่สอดคล้องกับหลักฐาน (evidence) $E_1, ..., E_k = e_1, ..., e_k$
2.  ทำการ Marginalize out (บวกรวมข้าม) ตัวแปรซ่อนเร้น (hidden variables) เพื่อให้ได้การแจกแจงร่วมของตัวแปรที่สนใจ (query) และตัวแปรหลักฐาน:
    $${\bf P}(Q,e_1,...,e_k) = \sum_{h_1, ..., h_r} \mathbf{P}(Q, h_1, ..., h_r, e_1, ..., e_k)$$
3.  ทำให้เป็นปกติ (Normalize):
    <br>
    $$\begin{aligned}
 Z &= \sum_q P(q,e_1,...,e_k) \\ 
 \mathbf{P}(Q|e_1, ..., e_k) &= \frac{1}{Z} \mathbf{P}(Q,e_1,...,e_k)
\end{aligned}$$ 

---

class: middle

.width-25.center[![](figures/lec5/bn-alarm.svg)]

พิจารณาโครงข่ายสัญญาณเตือนและคำถาม ${\bf P}(B|j,m)$ (ความน่าจะเป็นที่จะมีขโมย เมื่อจอห์นและแมรี่โทรมา)
$$\begin{aligned}
{\bf P}(B|j,m) &= \frac{1}{Z} \sum\_e \sum\_a \mathbf{P}(B,j,m,e,a) \\ 
 &\propto \sum\_e \sum\_a \mathbf{P}(B,j,m,e,a)
\end{aligned}$$ 
เมื่อใช้โครงข่ายเบย์ เราสามารถเขียนการแจกแจงร่วมในรูปผลคูณของค่าจาก CPT ได้:
$$\begin{aligned}
{\bf P}(B|j,m) &\propto \sum\_e \sum\_a \mathbf{P}(B)P(e){\bf P}(a|B,e)P(j|a)P(m|a)
\end{aligned}$$

# การอนุมานโดยการกำจัดตัวแปร (Variable Elimination)

อัลกอริทึม .bold[Variable Elimination] จะทำการบวกรวมจากขวาไปซ้าย และเก็บตัวคูณระหว่างกลาง (intermediate factors) เพื่อหลีกเลี่ยงการคำนวณซ้ำ
อัลกอริทึมจะทำงานสลับกันระหว่าง:
- การรวมตารางย่อย (Joining sub-tables)
- การกำจัดตัวแปรซ่อนเร้น (Eliminating hidden variables)

## Variable Elimination

คำถาม: ${\bf P}(Q|e_1, ..., e_k)$

1.  เริ่มต้นด้วยตัวคูณเริ่มต้น (initial factors) (คือ CPTs เฉพาะที่ ซึ่งถูกแทนค่าด้วยหลักฐานแล้ว)
2.  ตราบใดที่ยังมีตัวแปรซ่อนเร้น:
    1.  เลือกตัวแปรซ่อนเร้น $H$
    2.  รวม (Join) ตัวคูณทั้งหมดที่เกี่ยวข้องกับ $H$
    3.  กำจัด (Eliminate) H
3.  รวมตัวคูณที่เหลือทั้งหมด
4.  ทำให้เป็นปกติ (Normalize)

## การรวม (Join)

*ผลคูณแบบจุดต่อจุด (pointwise product) $\times$, หรือ **join**, ของสองตัวคูณ $\mathbf{f}_1$ และ $\mathbf{f}_2$ จะได้ตัวคูณใหม่ $\mathbf{f}\_3$
- เหมือนกับการทำ **database join**!
- ตัวแปรของ $\mathbf{f}\_3$ คือ *ยูเนียน* ของตัวแปรใน $\mathbf{f}_1$ และ $\mathbf{f}_2$
- สมาชิกของ $\mathbf{f}\_3$ ได้มาจากการคูณสมาชิกที่สอดคล้องกันใน $\mathbf{f}_1$ และ $\mathbf{f}_2$

## ความเกี่ยวข้อง (Relevance)

พิจารณาคำถาม ${\bf P}(J|b)$:
$${\bf P}(J|b) \propto P(b) \sum\_e P(e) \sum\_a P(a|b,e) \mathbf{P}(J|a) \sum\_m P(m|a)$$
- $\sum\_m P(m|a) = 1$ (เพราะผลรวมความน่าจะเป็นของทุกค่าที่เป็นไปได้ของ M ต้องเท่ากับ 1) ดังนั้น $M$ จึง **ไม่เกี่ยวข้อง (irrelevant)** กับคำถามนี้
- กล่าวอีกนัยหนึ่ง ${\bf P}(J|b)$ จะไม่เปลี่ยนแปลงถ้าเรานำ $M$ ออกจากเครือข่าย

# การอนุมานเชิงประมาณ (Approximate inference)

การอนุมานแบบแม่นตรง (Exact inference) นั้น **ไม่สามารถทำได้ในทางปฏิบัติ (intractable)** สำหรับแบบจำลองความน่าจะเป็นส่วนใหญ่ที่น่าสนใจในโลกแห่งความเป็นจริง (เช่น แบบจำลองที่มีตัวแปรจำนวนมาก, มีทั้งตัวแปรต่อเนื่องและไม่ต่อเนื่อง, มีวงจรแบบไม่มีทิศทาง ฯลฯ)

เราจึงต้องหันไปใช้อัลกอริทึมการอนุมาน **เชิงประมาณ (approximate)**:
- **วิธีสุ่มตัวอย่าง (Sampling methods):** สร้างคำตอบโดยการสุ่มตัวอย่างซ้ำๆ จากการแจกแจงที่สนใจ
- **วิธีเชิงการแปรผัน (Variational methods):** กำหนดปัญหาการอนุมานให้เป็นปัญหาการหาค่าที่เหมาะสมที่สุด (optimization problem)
- **วิธี Belief propagation:** กำหนดการอนุมานเป็นอัลกอริทึมการส่งผ่านข้อความ (message-passing)
- **วิธี Machine learning:** เรียนรู้การประมาณค่าของการแจกแจงเป้าหมายจากข้อมูลตัวอย่าง

# การประมาณค่าด้วยความควรจะเป็นสูงสุด (Maximum Likelihood Estimation)

สมมติว่าเรามีชุดข้อมูลสังเกต $N$ ชุดที่เป็นอิสระและมีการแจกแจงเหมือนกัน (i.i.d.) $\mathbf{d} = \{x_1, ..., x_N\}$

*ความควรจะเป็น (likelihood)* ของพารามิเตอร์ $\theta$ คือความน่าจะเป็นของข้อมูลเมื่อกำหนดพารามิเตอร์
$$P(\mathbf{d}|\theta) = \prod
_{j=1}^N P(x_j | \theta)$$

**ค่าประมาณความควรจะเป็นสูงสุด (Maximum Likelihood Estimate - MLE)** 

$\theta$ ของพารามิเตอร์ คือค่าของ $\theta$ ที่ทำให้ค่า likelihood สูงที่สุด
$$\theta^* = \arg \max_\theta P(\mathbf{d}|\theta)$$

---

class: middle

ในทางปฏิบัติ:
1.  เขียนฟังก์ชัน log-likelihood $L(\theta) = \log P({\bf d}|\theta)$ ของพารามิเตอร์ $\theta$
2.  หาอนุพันธ์ $\frac{\partial L}{\partial \theta}$ ของ log-likelihood เทียบกับพารามิเตอร์ $\theta$
3.  หาค่าพารามิเตอร์ $\theta^*$ ที่ทำให้อนุพันธ์เป็นศูนย์ (และตรวจสอบว่า Hessian เป็น negative definite เพื่อให้แน่ใจว่าเป็นค่าสูงสุด)

???

ข้อสังเกต:
- การประเมินค่า likelihood อาจต้องมีการบวกรวมข้ามตัวแปรซ่อนเร้น ซึ่งก็คือการทำ inference
- การหาค่า $\theta^*$ อาจเป็นเรื่องยาก ต้องใช้เทคนิค optimization สมัยใหม่เข้าช่วย

## กรณี (a)

สัดส่วน $\theta$ ของลูกอมรสเชอร์รี่เป็นเท่าใด?

สมมติว่าเราแกะลูกอม $N$ เม็ด ได้รสเชอร์รี่ $c$ เม็ด และรสมะนาว $l=N-c$ เม็ด
ข้อมูลเหล่านี้เป็น i.i.d. ดังนั้น
$$P(\mathbf{d}|\theta) = \prod
_{j=1}^N P(x_j | \theta) = \theta^c (1-\theta)^l$$
หาค่าสูงสุดของฟังก์ชันนี้เทียบกับ $\theta$ ซึ่งจะง่ายกว่าถ้าทำกับ log-likelihood:
$$\begin{aligned}
 L(\mathbf{d}|\theta) &= \log P(\mathbf{d}|\theta) = c \log \theta + l \log(1-\theta) \\ 
 \frac{\partial L(\mathbf{d}|\theta)}{\partial \theta} &= \frac{c}{\theta} - \frac{l}{1-\theta}=0
\end{aligned}$$ 
ดังนั้น $\theta=\frac{c}{N}$

## กรณี (b)

เปลือกลูกอมสีแดงและสีเขียวขึ้นอยู่กับรสชาติอย่างน่าจะเป็น
เช่น likelihood ของลูกอมรสเชอร์รี่ในเปลือกสีเขียวคือ

$$\begin{aligned}
&P(\text{cherry}, \text{green}|\theta,\theta_1, \theta_2) \\ 
&= P(\text{cherry}|\theta,\theta_1, \theta_2) P(\text{green}|\text{cherry}, \theta,\theta_1, \theta_2) \\ 
&= \theta (1-\theta_1)
\end{aligned}$$ 

likelihood ของพารามิเตอร์ เมื่อมีลูกอม $N$ เม็ด, เชอร์รี่เปลือกแดง $r_c$ เม็ด, เชอร์รี่เปลือกเขียว $g_c$ เม็ด, ฯลฯ คือ
$$
\small
\begin{aligned}
 P(\mathbf{d}|\theta,\theta_1, \theta_2) = &\ \theta^c (1-\theta)^l \theta_1^{r_c}(1-\theta_1)^{g_c} \theta_2^{r_l} (1-\theta_2)^{g_l} \\ 
 L = &\ c \log \theta + l \log(1-\theta) + \\ 
 &\ r_c \log \theta_1 + g_c \log(1-\theta_1) + \\ 
 &\ r_l \log \theta_2 + g_l \log(1-\theta_2)
\end{aligned}$$

อนุพันธ์ของ $L$ จะให้ผลลัพธ์:
$$\begin{aligned}
 \frac{\partial L}{\partial \theta} &= \frac{c}{\theta} - \frac{l}{1-\theta} = 0 \Rightarrow \theta = \frac{c}{c+l} \\ 
 \frac{\partial L}{\partial \theta_1} &= \frac{r_c}{\theta_1} - \frac{g_c}{1-\theta_1} = 0 \Rightarrow \theta_1 = \frac{r_c}{r_c + g_c} \\ 
 \frac{\partial L}{\partial \theta_2} &= \frac{r_l}{\theta_2} - \frac{g_l}{1-\theta_2} = 0 \Rightarrow \theta_2 = \frac{r_l}{r_l + g_l}
\end{aligned}$$

# การเรียนรู้พารามิเตอร์แบบเบย์ (Bayesian parameter learning)

เราสามารถมองปัญหาการเรียนรู้พารามิเตอร์เป็นปัญหา **การอนุมานแบบเบย์ (Bayesian inference)** ได้:
- ทำให้พารามิเตอร์ $\theta$ เป็นตัวแปรสุ่ม (random variables) และมองว่าเป็นตัวแปรซ่อนเร้น
- กำหนดการแจกแจง **ก่อนหน้า (prior)** ${\bf P}(\theta)$ ให้กับพารามิเตอร์
- จากนั้น เมื่อมีข้อมูลเข้ามา เราจะอัปเดตความเชื่อของเราเกี่ยวกับพารามิเตอร์เพื่อหาการแจกแจง **ภายหลัง (posterior)** ${f P}(\theta|\mathbf{d})$

ในมุมมองนี้ พารามิเตอร์ไม่ใช่ค่าคงที่ที่เราพยายามจะหาค่าที่ดีที่สุดค่าเดียวอีกต่อไป แต่เป็นตัวแปรสุ่มที่มีการแจกแจงความน่าจะเป็นของตัวเอง ซึ่งจะเปลี่ยนแปลงไปเมื่อเราได้รับข้อมูลมากขึ้น

---

class: middle

## กรณี (a)

สัดส่วน $\theta$ ของลูกอมรสเชอร์รี่เป็นเท่าใด?

เราสมมติ prior แบบ Beta: $$P(\theta) = \text{Beta}(\theta|a,b) = \frac{1}{Z} \theta^{a-1} (1-\theta)^{b-1}$$ 
โดยที่ $Z$ คือค่าคงที่เพื่อให้เป็นปกติ (normalization constant)

จากนั้น เมื่อสังเกตเห็นลูกอมรสเชอร์รี่ จะได้ posterior:
$$
\small
\begin{aligned}
 P(\theta|\text{cherry}) &\propto P(\text{cherry}|\theta) P(\theta) \\ 
 &= \theta \cdot \text{Beta}(\theta|a,b) \\ 
 &\propto \theta \cdot \theta^{a-1} (1-\theta)^{b-1} \\ 
 &= \theta^a (1-\theta)^{b-1} \\ 
 &= \text{Beta}(\theta|a+1,b)
\end{aligned}$$ 
การสังเกตข้อมูลใหม่ จะเป็นการอัปเดตพารามิเตอร์ของ Beta distribution

## การประมาณค่า Posterior สูงสุด (Maximum a posteriori - MAP)

เมื่อไม่สามารถคำนวณ posterior แบบ  (analytically) ได้ เราสามารถใช้การประมาณค่า **Maximum a posteriori (MAP)** \\
ซึ่งประกอบด้วยการประมาณค่า posterior ด้วยจุดประมาณ $\theta^*$ ที่ทำให้การแจกแจง posterior มีค่าสูงสุด นั่นคือ 

$$
\begin{aligned}
\theta^* = \arg \max_\theta P(\theta|\mathbf{d}) = \arg \max_\theta P(\mathbf{d}|\theta) P(\theta)
\end{aligned}$$ 

MAP คล้ายกับ MLE แต่เพิ่มพจน์ของ prior $P(\theta)$ เข้ามา ซึ่งทำหน้าที่เหมือน "regularizer" ป้องกันไม่ให้ค่าพารามิเตอร์สุดโต่งเกินไปเมื่อมีข้อมูลน้อย

# สรุป

- **โครงข่ายเบย์ (Bayesian Network)** ระบุการแจกแจงร่วมทั้งหมด และมักจะมีขนาดเล็กกว่าการแจกแจงร่วมที่แจกแจงอย่างชัดเจนแบบทวีคูณ
- **โครงสร้าง (Topology)** ของโครงข่ายเบย์เข้ารหัสสมมติฐานความเป็นอิสระแบบมีเงื่อนไขระหว่างตัวแปรสุ่ม
- **การอนุมาน (Inference)** คือปัญหาของการคำนวณการแจกแจงความน่าจะเป็นแบบ marginal และ/หรือ conditional
    - การอนุมานแบบแม่นตรง (Exact inference) สามารถทำได้สำหรับโครงข่ายเบย์อย่างง่าย แต่ไม่สามารถทำได้ในทางปฏิบัติสำหรับแบบจำลองส่วนใหญ่
    - อัลกอริทึมการอนุมานเชิงประมาณ (Approximate inference) ถูกนำมาใช้ในทางปฏิบัติ
- **พารามิเตอร์** ของโครงข่ายเบย์สามารถเรียนรู้ได้จากข้อมูลโดยใช้ Maximum Likelihood Estimation (MLE) หรือ Bayesian inference
