# MDPs

**กระบวนการตัดสินใจของมาร์คอฟ** (Markov decision process: MDP) คือทูเพิล $(\mathcal{S}, \mathcal{A}, P, R)$ ที่ประกอบด้วย:
- $\mathcal{S}$ คือเซตของสถานะ $s$;
- $\mathcal{A}$ คือเซตของการกระทำ $a$;
- $P$ คือแบบจำลองการเปลี่ยนผ่าน (stationary) โดย $P(s'|s,a)$ แทนความน่าจะเป็นในการไปถึงสถานะ $s'$ เมื่อทำการกระทำ $a$ ที่สถานะ $s$;
- $R$ คือฟังก์ชันรางวัลที่ให้ค่ารางวัลทันที (จำกัด) $R(s)$ สำหรับสถานะ $s$;
- ($0 < \gamma \leq 1$ คือตัวคูณลดค่า หรือ discount factor.)

## ข้อสังเกต

- แม้ว่า MDP จะทั่วไปไปยังปริภูมิสถานะ/การกระทำต่อเนื่องได้ แต่ในบทนี้เราจะสมมติว่า $\mathcal{S}$ และ $\mathcal{A}$ เป็นแบบไม่ต่อเนื่องและมีจำนวนจำกัด
- รูปแบบนิยามของ MDP ไม่ได้มีแบบเดียว โดยอีกแบบที่ใช้กันแพร่หลายคือกำหนดฟังก์ชันรางวัลตามการเปลี่ยนผ่าน $(s,a,s')$ คือ $R(s,a,s')$ ซึ่งจะทำให้ได้รูปแบบอัลกอริทึมที่ต่างออกไปเล็กน้อย (แต่เทียบเท่า) กับบทบรรยายที่ 8

# สมการเบลล์แมน (The Bellman equation)

อรรถประโยชน์ของสถานะคือรางวัลทันทีของสถานะนั้น บวกด้วยอรรถประโยชน์ที่คาดหวังแบบมีการลดค่า (discounted) ของสถานะถัดไป โดยสมมติว่าเอเจนต์เลือกการกระทำที่เหมาะที่สุด:
$$V(s) = R(s) + \gamma  \max\_{a} \sum\_{s'} P(s'|s,a) V(s').$$

.center.width-50[![](figures/lec8/how-to.png)]

.footnote[เครดิตภาพ: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]

---

# การวนค่ามูลค่า (Value iteration)

อัลกอริทึม **Value iteration** ให้กระบวนการวนคงที่ (fixed-point iteration) เพื่อคำนวณอรรถประโยชน์ของสถานะ $V(s)$:
- ให้ $V\_i(s)$ เป็นค่าประมาณอรรถประโยชน์ของ $s$ ณ รอบที่ $i$;
- **Bellman update** คือการอัปเดตค่าประมาณทั้งหมดพร้อมกันให้สอดคล้องกับสมการเบลล์แมนในเชิงเฉพาะที่:
$$V\_{i+1}(s) = R(s) + \gamma \max\_a \sum\_{s'} P(s'|s,a) V\_i(s'). $$
- ทำซ้ำจนบรรจบ

---

# การวนค่านโยบาย (Policy iteration)

อัลกอริทึม **Policy iteration** คำนวณนโยบายโดยตรง (แทนที่จะคำนวณค่าสถานะ) โดยสลับสองขั้นตอนต่อไปนี้:
- ประเมินนโยบาย: เมื่อกำหนด $\pi\_i$ ให้คำนวณ $V\_i = V^{\pi\_i}$ คืออรรถประโยชน์ของแต่ละสถานะเมื่อรัน $\pi\_i$:
$$V\_i(s)  = R(s) + \gamma \sum\_{s'} P(s'|s,\pi\_i(s)) V\_i(s').$$
- ปรับปรุงนโยบาย: คำนวณนโยบายใหม่ $\pi\_{i+1}$ ด้วยการมองล่วงหน้า 1 ก้าวจาก $V\_i$:
$$\pi\_{i+1}(s) = \arg\max\_a \sum\_{s'} P(s'|s,a)V\_i(s').$$

## เกิดอะไรขึ้น?

- นี่ไม่ใช่การวางแผน (planning) แต่มันคือการเรียนรู้เสริมกำลัง!
- มี MDP อยู่ แต่ไก่ไม่สามารถแก้ด้วยการคำนวณอย่างเดียว
- ไก่ต้องลงมือกระทำจริงเพื่อหาคำตอบ

## แนวคิดสำคัญใน RL ที่โผล่มา
- การสำรวจ (Exploration): ต้องลองการกระทำที่ไม่รู้จักเพื่อเก็บข้อมูล
- การแสวงหาผล (Exploitation): ในที่สุดต้องใช้ความรู้ที่มีให้เกิดประโยชน์
- ความเสียใจ (Regret): แม้เรียนรู้อย่างชาญฉลาด ก็อาจทำพลาดได้
- การสุ่มตัวอย่าง (Sampling): เพราะความบังเอิญ ต้องลองซ้ำๆ หลายครั้ง
- ความยาก: การเรียนรู้อาจยากกว่าการแก้ MDP ที่รู้จักดีอยู่แล้วมาก

# Reinforcement learning

เรายังคงสมมติ MDP $(\mathcal{S}, \mathcal{A}, P, R)$ ที่
- $\mathcal{S}$ คือเซตของสถานะ $s$;
- $\mathcal{A}$ คือเซตของการกระทำ $a$;
- $P$ คือแบบจำลองการเปลี่ยนผ่าน (stationary) โดย $P(s'|s,a)$ แทนความน่าจะเป็นในการไปถึง $s'$ เมื่อทำ $a$ ที่ $s$;
- $R$ คือฟังก์ชันรางวัลที่ให้รางวัลทันที $R(s)$ ในสถานะ $s$.

เป้าหมายของเราคือหานโยบายที่เหมาะที่สุด $\pi^*(s)$

## เป้าหมาย: ประเมินนโยบาย (policy evaluation)

# การประมาณแบบมีแบบจำลอง (Model-based estimation)

เอเจนต์แบบ **Model-based** จะประมาณแบบจำลองการเปลี่ยนผ่านและรางวัล $\hat{P}$ และ $\hat{R}$ จากประสบการณ์ แล้วประเมิน MDP เชิงประจักษ์ที่ได้

- ขั้นที่ 1: เรียนรู้ MDP เชิงประจักษ์
  - ประมาณ $\hat{P}(s'|s,a)$ จากตัวอย่างเชิงประจักษ์ $(s,a,s')$ หรือด้วยการเรียนรู้แบบมีผู้สอน
  - ค้นหารางวัล $\hat{R}(s)$ ของแต่ละ $s$
- ขั้นที่ 2: ประเมิน $\pi$ ด้วย $\hat{P}$ และ $\hat{R}$ เช่น
  $$V(s)  = \hat{R}(s) + \gamma \sum\_{s'} \hat{P}(s'|s,\pi(s)) V(s').$$

.center.width-40[![](figures/lec9/model-based-rl.png)]

.footnote[เครดิตภาพ: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]

# การประมาณแบบไร้แบบจำลอง (Model-free estimation)

เราจะเรียนรู้ $V^\pi$ แบบ **ไร้แบบจำลอง** ได้ไหม โดยไม่ต้องสร้างแบบจำลองสิ่งแวดล้อมชัดๆ เช่น ไม่ต้องเรียนรู้ $\hat{P}$ และ $\hat{R}$?

# การประมาณอรรถประโยชน์โดยตรง (Direct utility estimation)

(หรือ Monte Carlo evaluation)

- อรรถประโยชน์ $V^\pi(s)$ ของสถานะ $s$ คือรางวัลรวมที่คาดหวังจากสถานะนั้นไปข้างหน้า (เรียกว่า **reward-to-go** ที่คาดหวัง)
$$V^\pi(s) = \mathbb{E}\left[\sum\_{t=0}^\infty \gamma^t R(s\_t) \right]\Biggr\rvert\_{s\_0=s}$$
- แต่ละการทดลองให้ตัวอย่างของปริมาณนี้สำหรับสถานะที่ถูกเยี่ยม
- ดังนั้น เมื่อจบลำดับหนึ่งๆ เราสามารถอัปเดตค่าเฉลี่ยตัวอย่าง $\hat{V}^\pi(s)$ โดย:
  - คำนวณ reward-to-go ที่สังเกตสำหรับแต่ละสถานะ
  - อัปเดตค่าประมาณอรรถประโยชน์ของสถานะนั้นด้วยค่าเฉลี่ยสะสม
- เมื่อจำนวนการทดลองไปสู่อนันต์ ค่าเฉลี่ยตัวอย่างจะบรรจบสู่ค่าคาดหมายจริง

# การเรียนรู้แบบความต่างตามเวลา (Temporal-difference learning)

TD learning อัปเดต $V^\pi(s)$ ทุกครั้งที่เอเจนต์ประสบการเปลี่ยนผ่าน $(s, r=R(s), a=\pi(s), s')$

.width-20.center[![](figures/lec9/td-triple.png)]

เมื่อเกิดการเปลี่ยนจาก $s$ ไป $s'$ การอัปเดตแบบ TD จะพยายามดัน $V^\pi(s)$ ให้สอดคล้องกับสมการเบลล์แมนของนโยบายคงที่ดีขึ้น คือ
$$V^\pi(s) \leftarrow V^\pi(s) + \alpha \underbrace{(r + \gamma V^\pi(s') - V^\pi(s))}\_{\text{temporal difference error}}$$
โดยที่ $\alpha$ คือพารามิเตอร์ *อัตราการเรียนรู้* (learning rate)

???

แทนที่จะรอจนจบ trajectory เพื่ออัปเดต $V^\pi(s)$ เราอัปเดตได้ทันที...

...

- ถ้า $r + \gamma V^\pi(s') > V^\pi(s)$ แสดงว่าค่าคาดการณ์ต่ำเกินไป จึงเพิ่ม
- ถ้า $r + \gamma V^\pi(s') < V^\pi(s)$ แสดงว่าค่าคาดการณ์สูงเกินไป จึงลด

# การเรียนรู้แบบมีแบบจำลอง (Model-based learning)

เอเจนต์แบบ model-based ในโหมด passive ทำให้เป็น active ได้โดยการหานโยบายเหมาะที่สุด $\pi^*$ ของ MDP เชิงประจักษ์แทน

เช่น เมื่อได้ฟังก์ชันอรรถประโยชน์ $V$ ที่เหมาะที่สุดสำหรับแบบจำลองที่เรียนรู้มา (เช่น ด้วย Value Iteration) การกระทำที่เหมาะที่สุดจากการมองล่วงหน้า 1 ก้าว คือ
$$\pi^*(s) = \arg \max\_a \sum\_{s'} \hat{P}(s'|s,a) V(s').$$

- แบบจำลองการเปลี่ยนผ่านและรางวัลที่เรียนรู้ $\hat{P}$ และ $\hat{R}$ ไม่ตรงกับโลกจริง เพราะอาศัยตัวอย่างที่ได้จากนโยบายของเอเจนต์เอง ซึ่งมีอคติ
- ดังนั้นสิ่งที่เหมาะที่สุดภายใต้แบบจำลองที่เรียนรู้อาจต่ำกว่าที่สุดในโลกจริง

# การสำรวจ (Exploration)

การกระทำไม่ได้แค่ให้รางวัลตามแบบจำลองที่เรียนรู้ในปัจจุบัน แต่ยังช่วยให้เรียนรู้โลกจริงด้วย

นี่คือสงคราม **แสวงหาผล-สำรวจ** (exploitation-exploration):
- แสวงหาผล: ทำตามการกระทำที่เพิ่มรางวัลสูงสุดภายใต้แบบจำลองปัจจุบัน
- สำรวจ: เลือกการกระทำเพื่อสำรวจและเรียนรู้โลกจริง

.center.width-60[![](figures/lec9/exploitation-exploration.png)]

.footnote[เครดิตภาพ: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]

---

class: middle 

## จะสำรวจอย่างไร?

วิธีง่ายสุดเพื่อบังคับการสำรวจ: การกระทำแบบสุ่ม ($\epsilon$-greedy)
- ด้วยความน่าจะเป็น (เล็ก) $\epsilon$ กระทำแบบสุ่ม
- ด้วยความน่าจะเป็น (ใหญ่) $(1-\epsilon)$ ทำตามนโยบายปัจจุบัน

$\epsilon$-greedy จะสำรวจครบในที่สุด แต่จะยัง “ซัดไปมา” แม้เรียนรู้เสร็จแล้ว

---

class: middle 

## ควรสำรวจเมื่อใด?

ไอเดียที่ดีกว่า: สำรวจบริเวณที่ยังไม่แน่ชัดว่าแย่ แล้วหยุดสำรวจเมื่อมั่นใจ

ให้ $V^+(s)$ เป็นค่าประมาณแบบมองโลกในแง่ดีของอรรถประโยชน์สถานะ $s$ และ $N(s,a)$ คือจำนวนครั้งที่เคยลองการกระทำ $a$ ใน $s$ 

สำหรับ Value Iteration สมการอัปเดตกลายเป็น
$$V^+\_{i+1}(s) = R(s) + \gamma \max\_a f(\sum_{s'} P(s'|s,a) V^+\_i(s'), N(s,a)),$$
โดยที่ $f(v, n)$ เรียกว่า **exploration function**

ฟังก์ชัน $f(v,n)$ ควรเพิ่มเมื่อ $v$ มากขึ้น และลดเมื่อ $n$ มากขึ้น ตัวเลือกง่ายๆ คือ $f(v,n) = v + K/n$

# ทางอ้อม: ค่า Q (Détour: Q-values)

.grid[
.kol-1-2[
- ค่าของสถานะ $V(s)$ คืออรรถประโยชน์ที่คาดหวังเมื่อเริ่มที่ $s$ และกระทำอย่างเหมาะที่สุด
- ค่าของคู่สถานะ-การกระทำ $Q(s,a)$ คืออรรถประโยชน์ที่คาดหวังเมื่อเริ่มจากทำการกระทำ $a$ ที่ $s$ แล้วหลังจากนั้นกระทำอย่างเหมาะที่สุด ดังนั้น $V(s) = \max\_a Q(s,a)$
]
.kol-1-2.width-100[![](figures/lec9/optimal-quantities.png)]
]

---

class: middle

## นโยบายที่เหมาะที่สุด (Optimal policy)

นิยามนโยบายที่เหมาะที่สุด $\pi(s)$ ได้ทั้งในแง่ของ $V(s)$ หรือ $Q(s,a)$:
$$\begin{aligned}
\pi(s) &= \arg \max\_a \sum\_{s'} P(s'|s,a) V(s') \\
&= \arg \max\_a Q(s,a)
\end{aligned}$$

.footnote[เครดิตภาพ: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]

---

class: middle

## สมการเบลล์แมนสำหรับ $Q$

เพราะ $V(s) = \max\_a Q(s,a)$ ค่าของ $Q(s,a)$ นิยามเวียนเกิดได้เป็น
$$\begin{aligned}
Q(s,a) &= R(s) + \gamma \sum\_{s'} P(s'|s,a) V(s') \\
&= R(s) + \gamma \sum\_{s'} P(s'|s,a) \max\_{a'} Q(s',a').
\end{aligned} $$

เช่นเดียวกับ Value Iteration สมการสุดท้ายใช้เป็นสมการอัปเดตเพื่อวนหาจุดคงที่ของ $Q(s,a)$ ได้ แต่ยังต้องรู้ $P(s'|s,a)$ อยู่ดี!

# Q-Learning

ค่า $Q(s,a)$ เรียนรู้ได้แบบไร้แบบจำลองด้วยวิธี TD ที่เรียกว่า **Q-Learning**

Q-Learning จะอัปเดต $Q(s,a)$ ทุกครั้งที่เอเจนต์ประสบการเปลี่ยนผ่าน $(s, r=R(s), a, s')$

สมการอัปเดตของ TD Q-Learning คือ
$$Q(s,a) \leftarrow Q(s,a) + \alpha (r + \gamma \max\_{a'} Q(s',a') - Q(s,a)).$$

.alert[เพราะ $\pi^*(s) = \arg \max\_a Q(s,a)$ ตัวแทนแบบ TD ที่เรียนรู้ค่า Q จึงไม่ต้องมีแบบจำลอง $P(s'|s,a)$ ไม่ว่าจะเพื่อการเรียนรู้หรือเพื่อเลือกการกระทำ!]

  - อัตราการเรียนรู้ต้องเล็กลงในที่สุด
  - ... แต่อย่าลดเร็วเกินไป

## การแทนด้วยคุณลักษณะ (Feature-based representations)

วิธีแก้: อธิบายสถานะ $s$ ด้วยเวกเตอร์คุณลักษณะ $\mathbf{x} = [f\_1(s), ..., f\_d(s)] \in \mathbb{R}^d$
- คุณลักษณะเป็นฟังก์ชัน $f\_k$ จากสถานะไปยังจำนวนจริงที่จับคุณสมบัติสำคัญของสถานะ

  - จำนวนผี
  - ...
- อธิบาย q-state $(s, a)$ ด้วยคุณลักษณะ $f\_k(s,a)$ ได้เช่นกัน

## Q-Learning แบบประมาณค่า (Approximate Q-Learning)

เมื่อใช้การแทนด้วยคุณลักษณะ ตาราง Q สามารถแทนด้วยตัวประมาณฟังก์ชัน เช่น แบบจำลองเชิงเส้น
$$Q(s,a) = w\_1 f\_1(s,a) + w\_2 f\_2(s,a) + ... + w\_d f\_d(s,a).$$

เมื่อเกิดการเปลี่ยนผ่าน $(s, r, a, s')$ การอัปเดตกลายเป็น
$$
w\_k \leftarrow  w\_k + \alpha (r + \gamma \max\_{a'} Q(s', a') - Q(s,a)) f\_k(s,a),
$$
สำหรับทุก $w\_k$

.footnote[เครดิตภาพ: [CS188](https://inst.eecs.berkeley.edu/~cs188/), UC Berkeley.]


*จำได้ไหมว่า TD-update มองเป็นการอัปเดต GD ออนไลน์ได้ แต่ตอนนี้เราไม่ปรับ $Q(s,a)$ โดยตรง เราปรับพารามิเตอร์ของตัวประมาณฟังก์ชันแทน*

---

class: middle

ในรีเกรสชันเชิงเส้น สมมติว่ามีจุดเดียว $\mathbf{x}$ ที่มีคุณลักษณะ $[f\_1, ..., f\_d]$ จะได้
$$
\begin{aligned}
\ell(\mathbf{w}) &= \frac{1}{2} \left( y - \sum\_k w\_k f\_k \right)^2 \\
\frac{\partial \ell}{\partial w\_k} &= -\left(y -  \sum\_k w\_k f_k \right) f\_k \\
w\_k &\leftarrow w\_k + \alpha \left(y -  \sum\_k w\_k f\_k \right) f\_k,
\end{aligned}
$$

จึงได้การอัปเดต Q
$$w\_k \leftarrow w\_k + \alpha \left(\underbrace{r + \gamma \max\_{a'} Q(s', a')}\_{\text{target}\, y} -  \underbrace{Q(s,a)}\_{\text{prediction}} \right) f\_k(s,a).$$
