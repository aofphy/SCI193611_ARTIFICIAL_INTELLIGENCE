# ส่วนที่ 1: Harness คืออะไร

---

# นิยาม

> **Harness คือโปรแกรมที่ห่อหุ้มโมเดล และแปลงมันจาก "ตัวทำนายโทเคน" ให้เป็น "ผู้ช่วยที่ทำงานได้จริง"**

```text
        +-----------------------------------------------+
        |                  HARNESS                      |
        |                                               |
        |  พรอมป์ตระบบ | ชุดเครื่องมือ | ชั้นสิทธิ์      |
        |  ตัวจัดการบริบท | เอเจนต์ย่อย | hooks         |
        |  สถานะเซสชัน | ส่วนติดต่อผู้ใช้                |
        |                                               |
        |          +----------------------+             |
        |          |        MODEL         |             |
        |          |  (เปลี่ยนตัวได้)      |             |
        |          +----------------------+             |
        +-----------------------------------------------+
```

.alert[
**ข้อสังเกตที่สำคัญที่สุดของสัปดาห์นี้:**
ความสามารถของผู้ช่วย AI ที่คุณใช้ ไม่ได้มาจากโมเดลเพียงอย่างเดียว
โมเดลตัวเดียวกันใน harness ที่ต่างกัน ให้ผลลัพธ์ต่างกันอย่างมาก
]

---

# ตัวอย่าง harness ที่ควรรู้จัก

| Harness | รูปแบบ | โมเดลที่ใช้ได้ | โอเพนซอร์ส |
| --- | --- | --- | --- |
| **Claude Code** | เทอร์มินัล, IDE | Claude | ไม่ (แต่ขยายได้เต็มที่) |
| **Gemini CLI** | เทอร์มินัล | Gemini | ใช่ |
| **Qwen Code** | เทอร์มินัล | Qwen และอื่น ๆ | ใช่ |
| **OpenAI Codex CLI** | เทอร์มินัล | GPT | ใช่ |
| **Cline / Roo Code** | ส่วนขยาย VS Code | ต่อ API ใดก็ได้ | ใช่ |
| **Aider** | เทอร์มินัล | ต่อ API ใดก็ได้ | ใช่ |
| **OpenHands** | เว็บ, คอนเทนเนอร์ | ต่อ API ใดก็ได้ | ใช่ |
| **Cursor / Windsurf** | ตัวแก้ไขโค้ด | หลายโมเดล | ไม่ |

.footnote[หลายตัวรองรับโมเดลเปิดน้ำหนักผ่าน Ollama หรือ endpoint ที่เข้ากันได้กับ OpenAI ทำให้ทดลองได้ฟรีบนเครื่องตัวเอง]

# กายวิภาค: 1. พรอมป์ตระบบและเครื่องมือ

**พรอมป์ตระบบ** ของ harness ระดับใช้งานจริงมักยาวหลายพันโทเคน ประกอบด้วย

- บทบาทและน้ำเสียง
- คำอธิบายสภาพแวดล้อม (ระบบปฏิบัติการ, ไดเรกทอรี, สถานะ git)
- กติกาความปลอดภัยและขอบเขตที่ห้ามข้าม
- แนวทางการใช้เครื่องมือแต่ละตัว
- ข้อกำหนดรูปแบบผลลัพธ์

**ชุดเครื่องมือหลัก** ที่แทบทุก coding harness มีเหมือนกัน

.grid[
.kol-1-2[
- อ่านไฟล์, เขียนไฟล์, แก้ไขบางส่วน
- ค้นด้วยชื่อไฟล์ (glob) และเนื้อหา (grep)
]
.kol-1-2[
- รันคำสั่งเชลล์
- ค้นเว็บ, ดึงหน้าเว็บ
- จัดการรายการงาน
]
]

.question[**สังเกต:** `read`, `edit`, `grep`, `bash` สี่ตัวนี้ครอบคลุมงานเขียนโปรแกรมได้เกือบทั้งหมด นี่คือหลักการออกแบบเครื่องมือจากสัปดาห์ที่ 11 ที่ใช้จริง: เครื่องมือน้อย ทรงพลัง และประกอบกันได้]

---

# กายวิภาค: 2. ชั้นสิทธิ์

จุดที่แยก harness ระดับของเล่นออกจากระดับใช้งานจริง

```text
โมเดลขอเรียก:  bash("rm -rf build/")
                        |
                        v
          +---------------------------+
          |  ตรวจกับกฎที่ตั้งไว้        |
          +---------------------------+
           /            |             \
   อนุญาตอัตโนมัติ    ถามผู้ใช้      ปฏิเสธเสมอ
   (read, grep,     (เขียนไฟล์,    (rm -rf /,
    git status)      git push)      แก้ไฟล์ระบบ)
```

**โหมดที่มักมีให้เลือก**

- ถามทุกครั้งที่จะเปลี่ยนแปลงอะไร (ค่าเริ่มต้น)
- อนุญาตแก้ไฟล์อัตโนมัติ แต่ถามก่อนรันคำสั่ง
- อนุญาตทุกอย่าง (ใช้เฉพาะใน sandbox หรือ CI เท่านั้น)

.alert[**อย่ารันโหมดอนุญาตทุกอย่างบนเครื่องที่มีข้อมูลจริง** ให้ใช้คอนเทนเนอร์ หรือสำเนาที่ทิ้งได้ นี่คือหลัก sandbox จากสัปดาห์ที่แล้วในรูปแบบที่ใช้งานจริง]

---

# กายวิภาค: 3. ตัวจัดการบริบท

งานที่ยากที่สุดของ harness คือจัดการหน้าต่างบริบทที่มีจำกัด

| กลไก | ทำอะไร |
| --- | --- |
| **การบีบอัด (compaction)** | เมื่อบริบทใกล้เต็ม สรุปการสนทนาเก่าเป็นบทสรุป แล้วทำงานต่อ |
| **ไฟล์คำสั่งประจำโปรเจกต์** | `CLAUDE.md`, `AGENTS.md`, `GEMINI.md` โหลดอัตโนมัติทุกเซสชัน |
| **การอ่านแบบเลือกส่วน** | อ่านไฟล์เฉพาะช่วงบรรทัด แทนที่จะโหลดทั้งไฟล์ |
| **การตัดผลลัพธ์เครื่องมือ** | ตัดผลลัพธ์ยาว ๆ และเก็บส่วนเต็มไว้ในไฟล์แทน |
| **การถ่ายลงไฟล์** | เขียนแผนหรือความคืบหน้าลงไฟล์ แล้วอ่านกลับเมื่อต้องใช้ |

.question[
`AGENTS.md` เป็นข้อตกลงกลางที่เครื่องมือหลายค่ายรองรับ
ใส่กติกาของโปรเจกต์ไว้ในนั้น เช่น วิธีรันเทส รูปแบบโค้ด ข้อห้าม
แล้วผู้ช่วย AI ทุกตัวที่ทีมคุณใช้จะเห็นเหมือนกัน
]

---

# กายวิภาค: 4. เอเจนต์ย่อยและ hooks

.grid[
.kol-1-2[
**เอเจนต์ย่อย (Subagents)**

งานสำรวจที่ต้องอ่านข้อมูลมาก ถูกส่งไปทำในบริบทแยก แล้วส่งกลับมาแค่ข้อสรุป

```text
หลัก: "หาว่า auth ทำงานอย่างไร"
  --> ย่อย: อ่าน 30 ไฟล์
  --> กลับมา: สรุป 15 บรรทัด
```

บริบทของเอเจนต์หลักเหลือพื้นที่ทำงานต่อ
]
.kol-1-2[
**Hooks**

โค้ดของเราที่ถูกเรียกอัตโนมัติ ณ จุดที่กำหนด

| จุด | ใช้ทำอะไร |
| --- | --- |
| ก่อนใช้เครื่องมือ | บล็อกคำสั่งอันตราย |
| หลังใช้เครื่องมือ | รัน formatter, linter |
| เริ่มเซสชัน | ใส่บริบทของโปรเจกต์ |
| ก่อนบีบอัดบริบท | บันทึกสถานะไว้ |

hooks เป็น**โปรแกรมจริง** จึงบังคับใช้กฎได้แน่นอน ต่างจากพรอมป์ตที่โมเดลอาจไม่ทำตาม
]
]

.alert[**หลักการ:** อะไรที่ **ต้อง** เกิดขึ้นทุกครั้ง ให้ทำด้วย hook ไม่ใช่ด้วยการเขียนใส่พรอมป์ต]

# ส่วนที่ 2: Agent Skills

---

# ปัญหา: จะสอนความรู้เฉพาะทางให้เอเจนต์อย่างไร

สมมติแล็บของคุณมีขั้นตอนเฉพาะ เช่น วิธีตั้งค่าไฟล์อินพุตของโปรแกรมคำนวณ

.grid[
.kol-1-2[
**ทางเลือกที่ไม่ดี**

- ใส่ทุกอย่างในพรอมป์ตระบบ
<br>กินบริบทตลอดเวลาแม้ไม่ได้ใช้
- fine-tune โมเดล
<br>แพง ช้า และแก้ไขยาก
- อธิบายใหม่ทุกครั้ง
<br>ไม่สม่ำเสมอและเสียเวลา
]
.kol-1-2[
**ทางเลือกที่ดี: Skills**

โฟลเดอร์ที่มีคำสั่ง สคริปต์ และเทมเพลต
ซึ่งเอเจนต์จะ**โหลดเมื่อต้องใช้เท่านั้น**

- ไม่กินบริบทเมื่อไม่ได้ใช้
- แก้ไขได้ทันที เป็นแค่ไฟล์ข้อความ
- เก็บใน git ได้ แชร์กันในทีมได้
- พกพาข้าม harness ได้
]
]

---

# การเปิดเผยแบบขั้นบันได (Progressive Disclosure)

หัวใจของแนวคิด Skills คือโหลดเท่าที่จำเป็นในแต่ละขั้น

```text
ขั้นที่ 1  ชื่อ + คำอธิบาย (ประมาณ 30 โทเคน)      <- อยู่ในบริบทเสมอ
              |
              |  โมเดลเห็นว่างานนี้ตรงกับคำอธิบาย
              v
ขั้นที่ 2  เนื้อหาของ SKILL.md (ไม่กี่ร้อยโทเคน)   <- โหลดเมื่อเรียกใช้
              |
              |  ต้องการรายละเอียดเพิ่ม
              v
ขั้นที่ 3  ไฟล์อ้างอิงและสคริปต์ในโฟลเดอร์         <- อ่านหรือรันเมื่อต้องใช้
```

.question[
**เปรียบเทียบกับ RAG:** ทั้งคู่คือการเลือกใส่ข้อมูลเข้าบริบทเมื่อจำเป็น
ต่างกันที่ RAG ค้นด้วยความคล้ายของเวกเตอร์ ส่วน Skills ให้**โมเดลเป็นคนเลือกเอง**
จากคำอธิบายที่มนุษย์เขียนไว้ จึงแม่นยำกว่ามากเมื่อขอบเขตของงานชัดเจน
]

# โครงสร้างของ Skill

# เขียน description ให้ดี คือ 80% ของงาน

`description` คือสิ่งเดียวที่โมเดลเห็นตอนตัดสินใจว่าจะเรียก skill นี้หรือไม่

.grid[
.kol-1-2[
**แย่**
```yaml
description: ช่วยเรื่อง VASP
```
กว้างเกินไป โมเดลไม่รู้ว่าเมื่อไรควรใช้
]
.kol-1-2[
**ดี**
```yaml
description: สร้างและตรวจไฟล์อินพุต
  ของ VASP (INCAR, KPOINTS, POSCAR)
  ใช้เมื่อผู้ใช้ขอตั้งค่าการคำนวณ DFT
  หรือถามถึงแท็กใน INCAR
```
ระบุทั้งขอบเขตและสัญญาณที่ควรกระตุ้น
]
]

**สูตรที่ใช้ได้ผล:** `[ทำอะไร] + [ใช้เมื่อ ...] + [คำสำคัญที่ผู้ใช้มักพูด]`

.alert[
**ข้อผิดพลาดที่พบบ่อยที่สุด:** เขียนเนื้อหาใน SKILL.md ดีมาก แต่เขียน description กว้าง ๆ
ผลคือ skill ไม่เคยถูกเรียกใช้เลย และไม่มีข้อความผิดพลาดใด ๆ ให้เห็น

.question[
**เมื่อไรควรใช้ Skill เทียบกับ MCP:**
<br>**Skill** = ความรู้และวิธีทำงาน ที่เอเจนต์ทำได้ด้วยเครื่องมือที่มีอยู่แล้ว (ไฟล์ข้อความ)
<br>**MCP** = การเชื่อมต่อกับระบบภายนอกที่ต้องมีโค้ดคุยด้วย (เซิร์ฟเวอร์)
<br>งานจริงมักใช้ทั้งคู่: MCP ให้ความสามารถ ส่วน Skill สอนว่าจะใช้ความสามารถนั้นอย่างไร

# Plugin: รวมทุกอย่างเป็นชุดเดียว

Plugin คือแพ็กเกจที่รวมส่วนขยายทุกชนิดไว้ ติดตั้งครั้งเดียวได้ทั้งชุด

```text
my-lab-plugin/
  .claude-plugin/
    plugin.json          <- ข้อมูลแพ็กเกจ ชื่อ เวอร์ชัน คำอธิบาย
  skills/
    vasp-input/SKILL.md  <- ความรู้เฉพาะทาง
    paper-review/SKILL.md
  commands/
    submit-job.md        <- คำสั่งลัด /submit-job
  agents/
    reviewer.md          <- นิยามเอเจนต์ย่อยเฉพาะทาง
  hooks/
    hooks.json           <- กฎอัตโนมัติ
  .mcp.json              <- เซิร์ฟเวอร์ MCP ที่มากับชุดนี้
```

**ประโยชน์กับทีมและห้องเรียน**

- นักศึกษาใหม่ติดตั้งครั้งเดียว ได้สภาพแวดล้อมเหมือนกันทั้งชั้น
- อัปเดตผ่าน git ทุกคนได้เวอร์ชันเดียวกัน
- ความรู้ของแล็บถูกเก็บเป็นโค้ด ไม่ใช่ในหัวคนใดคนหนึ่ง

# เปรียบเทียบกลไกขยายความสามารถ

| กลไก | เป็นอะไร | โหลดเมื่อไร | เหมาะกับ |
| --- | --- | --- | --- |
| **ไฟล์คำสั่งโปรเจกต์** | ข้อความ | ทุกเซสชัน | กติกาที่ใช้กับทุกงานในโปรเจกต์ |
| **Skill** | โฟลเดอร์ข้อความ + สคริปต์ | เมื่อโมเดลเห็นว่าตรงงาน | ความรู้เฉพาะทางที่ใช้เป็นบางครั้ง |
| **คำสั่งลัด** | ข้อความ | เมื่อผู้ใช้พิมพ์เรียก | ขั้นตอนที่ผู้ใช้เริ่มเอง |
| **เอเจนต์ย่อย** | นิยามเอเจนต์ | เมื่อถูกมอบหมายงาน | งานสำรวจที่กินบริบทมาก |
| **MCP server** | โปรแกรมที่รันอยู่ | เชื่อมต่อตอนเริ่ม | ต่อกับระบบภายนอก |
| **Hook** | โปรแกรม | ณ จุดที่กำหนด อัตโนมัติ | กฎที่ต้องบังคับใช้แน่นอน |

.question[
**คำถามคัดเลือก 3 ข้อ**
<br>1. ต้องใช้ทุกครั้งไหม ใช่ = ไฟล์คำสั่งโปรเจกต์
<br>2. ต้องเชื่อมระบบภายนอกไหม ใช่ = MCP
<br>3. ต้องเกิดขึ้นแน่นอนโดยไม่พึ่งดุลพินิจโมเดลไหม ใช่ = Hook
<br>นอกนั้นคือ Skill
]

# สรุป

- **Harness** คือโปรแกรมรอบโมเดล และเป็นตัวกำหนดความสามารถจริงพอ ๆ กับตัวโมเดลเอง
- องค์ประกอบหลัก: พรอมป์ตระบบ, เครื่องมือ, ชั้นสิทธิ์, ตัวจัดการบริบท, เอเจนต์ย่อย, hooks
- **Skills** คือความรู้เฉพาะทางในรูปโฟลเดอร์ ที่โหลดแบบขั้นบันไดเมื่อจำเป็น
จึงไม่กินบริบทเมื่อไม่ได้ใช้
- **`description` ที่เขียนดี** คือสิ่งที่กำหนดว่า skill จะถูกใช้จริงหรือไม่
- **Plugins** รวม skills, คำสั่ง, เอเจนต์ย่อย, MCP และ hooks เป็นชุดที่แจกจ่ายได้
- อะไรที่ต้องเกิดขึ้นแน่นอน ให้ใช้ hook ไม่ใช่พรอมป์ต
