# นิยาม

> **Harness คือโปรแกรมที่ห่อหุ้มโมเดล และแปลงมันจาก "ตัวทำนายโทเคน"
> ให้เป็น "ผู้ช่วยที่ทำงานได้จริง"**

.alert[
**ข้อสังเกตที่สำคัญที่สุดของสัปดาห์นี้:**
ความสามารถของผู้ช่วย AI ที่คุณใช้ ไม่ได้มาจากโมเดลเพียงอย่างเดียว
**โมเดลตัวเดียวกันใน harness ที่ต่างกัน ให้ผลลัพธ์ต่างกันอย่างมาก**
]

**หลักฐานเชิงประจักษ์:** โมเดลเดียวกันที่ทำคะแนน benchmark การเขียนโค้ดได้ต่างกัน
20 ถึง 30 จุด เมื่อรันภายใต้ harness ที่ต่างกัน
ความต่างมาจากชุดเครื่องมือ การจัดการบริบท และพรอมป์ตระบบ ล้วน ๆ

.question[
**นัยเชิงอาชีพ:** ถ้าความสามารถมาจาก harness พอ ๆ กับตัวโมเดล
แปลว่าคนที่เข้าใจและปรับแต่ง harness เป็น มีคุณค่าไม่ต่างจากคนที่ฝึกโมเดลเป็น
และเข้าถึงได้ง่ายกว่ามาก เพราะไม่ต้องมี GPU cluster
]

**พรอมป์ตระบบ** ของ harness ระดับใช้งานจริงมักยาวหลายพันโทเคน ประกอบด้วย

.grid[
.kol-1-2[
- บทบาทและน้ำเสียง
- คำอธิบายสภาพแวดล้อม (OS, ไดเรกทอรี, สถานะ git)
- กติกาความปลอดภัยและขอบเขตที่ห้ามข้าม
]
.kol-1-2[
- แนวทางการใช้เครื่องมือแต่ละตัว
- ข้อกำหนดรูปแบบผลลัพธ์
- วิธีจัดการเมื่อไม่แน่ใจ
]
]

**ชุดเครื่องมือหลัก** ที่แทบทุก coding harness มีเหมือนกัน

.grid[
.kol-1-2[
- อ่านไฟล์, เขียนไฟล์, แก้ไขบางส่วน
- ค้นด้วยชื่อไฟล์ (glob) และเนื้อหา (grep)
]
.kol-1-2[
- รันคำสั่งเชลล์

]
]

.question[
**สังเกต:** `read`, `edit`, `grep`, `bash` สี่ตัวนี้ครอบคลุมงานเขียนโปรแกรมได้เกือบทั้งหมด
นี่คือหลักการออกแบบเครื่องมือจากสัปดาห์ที่ 11 ที่ใช้จริง:
**เครื่องมือน้อย ทรงพลัง และประกอบกันได้** ชนะเครื่องมือเยอะที่เฉพาะเจาะจงเกินไป

# กายวิภาค: 2. ชั้นสิทธิ์

จุดที่แยก harness ระดับของเล่นออกจากระดับใช้งานจริง

```text
โมเดลขอเรียก:  bash("rm -rf build/")
                        |
                        v
          +---------------------------+
          |  ตรวจกับกฎที่ตั้งไว้        |
          +---------------------------+
           /            |             \
   อนุญาตอัตโนมัติ    ถามผู้ใช้      ปฏิเสธเสมอ
   (read, grep,     (เขียนไฟล์,    (rm -rf /,
    git status)      git push)      แก้ไฟล์ระบบ)
```

**โหมดที่มักมีให้เลือก**

- ถามทุกครั้งที่จะเปลี่ยนแปลงอะไร (ค่าเริ่มต้น)
- อนุญาตแก้ไฟล์อัตโนมัติ แต่ถามก่อนรันคำสั่ง
- อนุญาตทุกอย่าง (ใช้เฉพาะใน sandbox หรือ CI เท่านั้น)

.alert[**อย่ารันโหมดอนุญาตทุกอย่างบนเครื่องที่มีข้อมูลจริง** ให้ใช้คอนเทนเนอร์ หรือสำเนาที่ทิ้งได้ นี่คือหลัก sandbox จากสัปดาห์ที่แล้วในรูปแบบที่ใช้งานจริง]

# แบบฝึกหัด 1.1: ออกแบบนโยบายสิทธิ์

คุณตั้งค่า harness ให้ทีมนักศึกษาปริญญาโทใช้กับโค้ดงานวิจัยในเครื่องของแล็บ

จัดแต่ละคำสั่งลงใน 3 กลุ่ม: **อนุญาตอัตโนมัติ / ถามก่อน / ปฏิเสธเสมอ**

| # | คำสั่ง |
| --- | --- |
| ก | `pytest tests/` |
| ข | `git commit -m "..."` |
| ค | `git push origin main` |
| ง | `rm -rf results/` |
| จ | `pip install <package>` |
| ฉ | `sbatch job.sh` (ส่งงานเข้าคิว HPC ที่คิดเงินตามชั่วโมง) |
| ช | `curl -X POST https://api.example.com -d @data.json` |

???

ให้เวลา 6 นาที ข้อ ฉ กับ ช เป็นข้อที่ต้องเถียงกัน

---

class: middle

# เฉลย 1.1

| # | คำสั่ง | กลุ่ม | เหตุผล |
| --- | --- | --- | --- |
| ก | `pytest tests/` | **อัตโนมัติ** | อ่านอย่างเดียว ย้อนกลับได้ และเป็นวิธี**ตรวจความจริงภายนอก** ที่เราอยากให้ทำบ่อย ๆ |
| ข | `git commit` | **อัตโนมัติ** | ย้อนกลับได้ง่ายด้วย `git reset` และยังไม่ออกจากเครื่อง |
| ค | `git push origin main` | **ถามก่อน** | ออกสู่ภายนอก ย้อนกลับยาก กระทบคนอื่นในทีม |
| ง | `rm -rf results/` | **ถามก่อน** | ลบข้อมูลที่อาจใช้เวลาคำนวณเป็นวัน ย้อนกลับไม่ได้ |
| จ | `pip install` | **ถามก่อน** | เปลี่ยนสภาพแวดล้อม อาจพังงานคนอื่น และเป็น**ช่องทาง supply chain attack** |
| ฉ | `sbatch job.sh` | **ถามก่อน** | **ใช้เงินจริง** ตามชั่วโมง GPU |
| ช | `curl -X POST ... -d @data.json` | **ปฏิเสธเสมอ** | ส่งข้อมูลออกนอกองค์กร คือขาที่ 3 ของกฎสามประการ |

.alert[
**ข้อ ช คือข้อที่คนพลาดบ่อยที่สุด** หลายคนจัดเป็น "ถามก่อน"
แต่ถ้าเอเจนต์อ่านข้อมูลวิจัยได้ และเจอ prompt injection จากไฟล์ที่ดาวน์โหลดมา
คำขออนุมัติจะดูสมเหตุสมผลจนผู้ใช้กดผ่าน **การปฏิเสธที่ระดับระบบแข็งแรงกว่าการพึ่งวิจารณญาณของมนุษย์ที่กำลังรีบ**
]

# กายวิภาค: 3. ตัวจัดการบริบท

งานที่ยากที่สุดของ harness คือจัดการหน้าต่างบริบทที่มีจำกัด

| กลไก | ทำอะไร |
| --- | --- |
| **การบีบอัด (compaction)** | เมื่อบริบทใกล้เต็ม สรุปการสนทนาเก่าเป็นบทสรุป แล้วทำงานต่อ |
| **ไฟล์คำสั่งประจำโปรเจกต์** | `CLAUDE.md`, `AGENTS.md`, `GEMINI.md` โหลดอัตโนมัติทุกเซสชัน |
| **การอ่านแบบเลือกส่วน** | อ่านไฟล์เฉพาะช่วงบรรทัด แทนที่จะโหลดทั้งไฟล์ |
| **การตัดผลลัพธ์เครื่องมือ** | ตัดผลลัพธ์ยาว ๆ และเก็บส่วนเต็มไว้ในไฟล์แทน |
| **การถ่ายลงไฟล์** | เขียนแผนหรือความคืบหน้าลงไฟล์ แล้วอ่านกลับเมื่อต้องใช้ |

.question[
**นี่คือกลยุทธ์ 5 แบบจากสัปดาห์ที่ 9 ที่ถูกนำมาใช้จริง**
`AGENTS.md` เป็นข้อตกลงกลางที่เครื่องมือหลายค่ายรองรับ
ใส่กติกาของโปรเจกต์ไว้ในนั้น เช่น วิธีรันเทส รูปแบบโค้ด ข้อห้าม
แล้วผู้ช่วย AI ทุกตัวที่ทีมคุณใช้จะเห็นเหมือนกัน
]

.grid[

**เอเจนต์ย่อย (Subagents)**

งานสำรวจที่ต้องอ่านข้อมูลมาก ถูกส่งไปทำในบริบทแยก แล้วส่งกลับมาแค่ข้อสรุป

- **Skills** คือความรู้เฉพาะทางในรูปโฟลเดอร์ ที่โหลดแบบขั้นบันไดเมื่อจำเป็น

| กลไก | เป็นอะไร | โหลดเมื่อไร | เหมาะกับ |
| --- | --- | --- | --- |
| **ไฟล์คำสั่งโปรเจกต์** | ข้อความ | ทุกเซสชัน | กติกาที่ใช้กับทุกงานในโปรเจกต์ |
| **Skill** | โฟลเดอร์ข้อความ + สคริปต์ | เมื่อโมเดลเห็นว่าตรงงาน | ความรู้เฉพาะทางที่ใช้เป็นบางครั้ง |
| **คำสั่งลัด** | ข้อความ | เมื่อผู้ใช้พิมพ์เรียก | ขั้นตอนที่ผู้ใช้เริ่มเอง |
| **เอเจนต์ย่อย** | นิยามเอเจนต์ | เมื่อถูกมอบหมายงาน | งานสำรวจที่กินบริบทมาก |
| **MCP server** | โปรแกรมที่รันอยู่ | เชื่อมต่อตอนเริ่ม | ต่อกับระบบภายนอก |
| **Hook** | โปรแกรม | ณ จุดที่กำหนด อัตโนมัติ | กฎที่ต้องบังคับใช้แน่นอน |

.question[
**คำถามคัดเลือก 4 ข้อ ถามตามลำดับ**
<br>1. ต้องใช้ทุกครั้งไหม $\to$ ไฟล์คำสั่งโปรเจกต์
<br>2. ต้องเชื่อมระบบภายนอกไหม $\to$ MCP
<br>3. ต้องเกิดขึ้นแน่นอนโดยไม่พึ่งดุลพินิจโมเดลไหม $\to$ Hook
<br>4. ผู้ใช้เป็นคนเริ่มเองเสมอไหม $\to$ คำสั่งลัด
<br>**นอกนั้นคือ Skill**
]

# เฉลย 3.1

| # | คำตอบ | เหตุผล |
| --- | --- | --- |
| **ก** | **Hook** (หลังใช้เครื่องมือ) | ต้องเกิด **ทุกครั้ง** ไม่พึ่งดุลพินิจโมเดล คำถามข้อ 3 |
| **ข** | **ไฟล์คำสั่งโปรเจกต์** (`AGENTS.md`) | เป็นกติกาที่ใช้กับ **ทุกงาน** ในโปรเจกต์นี้ คำถามข้อ 1 |
| **ค** | **MCP server** | ต้องเชื่อมระบบภายนอกที่ต้องมีโค้ดคุยด้วย คำถามข้อ 2 |
| **ง** | **Skill** | ความรู้เฉพาะทาง ใช้เป็นบางครั้ง ซับซ้อนพอที่จะมี reference และ script |
| **จ** | **คำสั่งลัด** | ผู้ใช้เป็นคนเริ่มเองเสมอ คำถามข้อ 4 |

# ช่วงลงมือทำ: `labs/w13_skills_plugin/`

ปลั๊กอินตัวอย่างที่ครบทั้ง 4 กลไก รันได้ทันทีโดยไม่ต้องติดตั้งอะไร

```bash
# 1. ตรรกะของ skill ทำงานถูกต้องไหม
python plugin/skills/lab-report/scripts/check_report.py

# 2. hook บล็อกคำสั่งอันตรายได้จริงไหม
python plugin/hooks/block_secrets.py --self-check
echo '{"tool_input":{"command":"cat .env"}}' | python plugin/hooks/block_secrets.py

# 3. description ทำให้ skill ถูกเรียกถูกจังหวะไหม
python eval_skill.py --self-check
```

.alert[
**`eval_skill.py` คือหัวใจของแล็บนี้**
มันทำให้ปัญหา "skill ไม่เคยถูกเรียกและไม่มี error ให้เห็น" **กลายเป็นตัวเลขที่วัดได้**
<br>รันกับโมเดลจริง ดูว่าผิดทาง false negative (description แคบไป)
หรือ false positive (กว้างไป) แล้วแก้ `SKILL.md` แล้ววัดซ้ำ
<br>**นี่คือลูป evaluator-optimizer ของสัปดาห์หน้า ที่เราใช้กับตัวเอง**
]

# สรุป

- **Harness** คือโปรแกรมรอบโมเดล และกำหนดความสามารถจริงพอ ๆ กับตัวโมเดล
- องค์ประกอบ: พรอมป์ตระบบ, เครื่องมือ, ชั้นสิทธิ์, ตัวจัดการบริบท, เอเจนต์ย่อย, hooks
- **Skills** คือความรู้เฉพาะทางที่โหลดแบบขั้นบันได จึงไม่กินบริบทเมื่อไม่ได้ใช้
- **`description` คือสิ่งเดียวที่โมเดลเห็นตอนตัดสินใจ** และความล้มเหลวไม่มีข้อความเตือน
- **Plugins** รวม skills, คำสั่ง, เอเจนต์ย่อย, MCP และ hooks เป็นชุดที่แจกจ่ายได้
- เลือกกลไกด้วยคำถาม 4 ข้อ: ทุกครั้งไหม / ระบบภายนอกไหม / ต้องแน่นอนไหม / ผู้ใช้เริ่มไหม
- **อะไรที่ต้องเกิดขึ้นแน่นอน ให้ใช้ hook ไม่ใช่พรอมป์ต**
