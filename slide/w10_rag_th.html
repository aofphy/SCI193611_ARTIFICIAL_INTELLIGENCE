# ปัญหาที่ RAG แก้

| ปัญหา | RAG ช่วยอย่างไร |
| --- | --- |
| **วันตัดความรู้** | ค้นจากเอกสารล่าสุดตอนถาม |
| **ข้อมูลส่วนตัว/องค์กร** | โมเดลไม่เคยเห็นเอกสารภายใน แต่เราส่งให้ตอนถามได้ |
| **การหลอน** | จำกัดให้ตอบจากเอกสารที่ให้ไป และให้อ้างอิงแหล่ง |
| **ความสามารถตรวจสอบ** | ผู้ใช้ตามไปอ่านต้นทางได้ |
| **ต้นทุน** | ถูกกว่าการ fine-tune ใหม่ทุกครั้งที่เอกสารเปลี่ยน |

.question[
**เชื่อมกับสัปดาห์ที่ 8:** เราสรุปไว้ว่าการหลอนเกิดจากฟังก์ชันสูญเสียที่ไม่มีคำว่า "ความจริง"
อยู่ในสมการเลย จึงแก้ที่ตัวโมเดลไม่ได้ RAG คือการแก้ **นอกโมเดล**
โดยเปลี่ยนคำถามจาก "จำได้ไหม" เป็น "อ่านจากตรงนี้แล้วตอบ" ซึ่งเป็นงานที่โมเดลทำได้ดีกว่ามาก
]

# RAG, fine-tuning, หรือบริบทยาว: เลือกอย่างไร

| ต้องการ | ใช้ | เหตุผล |
| --- | --- | --- |
| ให้โมเดล**รู้**ข้อมูลใหม่ | **RAG** | อัปเดตได้ทันที แค่เพิ่มเอกสาร |
| ให้โมเดล**ตอบแบบ**ที่เราต้องการ | **Fine-tuning** | สอนพฤติกรรม ไม่ใช่ข้อเท็จจริง |
| เอกสารทั้งหมดเล็กกว่า 50k โทเคน | **ใส่ทั้งหมดในบริบท** | ง่ายกว่า แม่นกว่า ไม่มีขั้นค้นที่พลาดได้ |
| ต้องการข้อมูลสด ๆ ทุกวินาที | **เครื่องมือ (สัปดาห์ 11)** | เรียก API ตรง ไม่ต้องทำดัชนี |
| ต้องรวมข้อมูลจากทั้งคลัง เช่น "มีกี่ฉบับที่พูดถึง X" | **SQL หรือฐานข้อมูล** | การค้นความคล้ายตอบคำถามเชิงรวมไม่ได้ |

# ทำไมต้องแบ่งเอกสาร

เราแบ่งเอกสารเป็นชิ้นย่อยเพราะเหตุผลสามข้อ

1. **หน้าต่างบริบทมีจำกัด** ตามที่คำนวณกันในแบบฝึกหัดสัปดาห์ที่แล้ว
2. **เวกเตอร์เดียวแทนเอกสาร 50 หน้าไม่ได้** ความหมายถูกเฉลี่ยจนหายหมด
เอกสารที่พูดถึง 20 เรื่องจะได้เวกเตอร์ที่อยู่ "ตรงกลาง" และไม่ใกล้กับคำถามใดเลย
3. **เราอยากส่งเฉพาะย่อหน้าที่เกี่ยวข้อง** ไม่ใช่ทั้งบท

**ขนาดที่ใช้ได้จริง:** 300 ถึง 800 โทเคนต่อชิ้น ซ้อนทับกัน 10 ถึง 20%

```python
def chunk_text(text, size=500, overlap=75):
    words, chunks, i = text.split(), [], 0
    while i < len(words):
        chunks.append(" ".join(words[i:i + size]))
        i += size - overlap          # ซ้อนทับกันกันประโยคขาดกลาง
    return chunks
```

.footnote[การซ้อนทับป้องกันกรณีที่ใจความสำคัญถูกตัดพอดีที่รอยต่อ ราคาที่จ่ายคือพื้นที่จัดเก็บเพิ่มประมาณ 15%]

# สรุปชั่วโมงที่ 1

- RAG แก้: วันตัดความรู้, ข้อมูลส่วนตัว, การหลอน, ความสามารถตรวจสอบ, ต้นทุน
- **RAG สอนความรู้ · fine-tuning สอนพฤติกรรม** ถ้าปัญหาคือโมเดลไม่รู้ข้อมูล ใช้ RAG
- **ลองใส่ทั้งหมดในบริบทก่อนเสมอ** อย่าสร้างความซับซ้อนที่ยังไม่จำเป็น
- การแบ่งชิ้นคือการตัดสินใจเชิงออกแบบ ไม่ใช่แค่การนับคำ
- **เมทาดาทาไม่ใช่ของแถม** มันคือสิ่งที่ทำให้สร้างการอ้างอิงและกรองผลได้
- ตารางและโค้ดมีหน่วยความหมายของตัวเอง อย่าตัดกลาง

# การวัดความคล้าย

$$\text{cos}(\mathbf{a}, \mathbf{b}) = \frac{\mathbf{a} \cdot \mathbf{b}}{\|\mathbf{a}\|\,\|\mathbf{b}\|} \in [-1, 1]$$

ถ้าทำ normalize ให้เวกเตอร์ยาว 1 แล้ว โคไซน์จะเท่ากับผลคูณจุด ซึ่งเร็วกว่ามาก

```python
import numpy as np

def search(query_vec, doc_vecs, k=5):
    scores = doc_vecs @ query_vec        # (n_docs,) เพราะ normalize แล้ว
    idx = np.argsort(-scores)[:k]
    return idx, scores[idx]
```

.question[
**ทำไมใช้โคไซน์ ไม่ใช่ระยะทางแบบยุคลิด:** ความยาวของเวกเตอร์ฝังตัวมักสะท้อน

โคไซน์สนใจแค่ **ทิศทาง** จึงเทียบเอกสารสั้นกับยาวได้อย่างเป็นธรรม

# เฉลย 2.1 (ก และ ข)

$\|\mathbf{q}\| = \sqrt{9+16} = 5$, $\|\mathbf{d}\_1\| = \sqrt{36+64} = 10$,

# BM25: การค้นด้วยคำหลักที่ยังชนะอยู่

$$\text{score}(D,Q) = \sum\_{q \in Q} \text{IDF}(q) \cdot
\frac{f(q,D)\,(k\_1+1)}{f(q,D) + k\_1\left(1 - b + b\,\frac{|D|}{\text{avgdl}}\right)}$$

$$\text{IDF}(q) = \ln\left(1 + \frac{N - n(q) + 0.5}{n(q) + 0.5}\right)$$

| สัญลักษณ์ | ความหมาย | ทำหน้าที่อะไร |
| --- | --- | --- |
| $f(q,D)$ | คำ $q$ ปรากฏในเอกสาร $D$ กี่ครั้ง | ยิ่งเจอบ่อยยิ่งเกี่ยวข้อง |
| $k\_1 \approx 1.5$ | ตัวคุมความอิ่มตัว | เจอ 20 ครั้งไม่ได้ดีกว่าเจอ 10 ครั้งเป็นสองเท่า |
| $b \approx 0.75$ | ตัวคุมการปรับความยาว | เอกสารยาวเจอคำง่ายกว่า ต้องหักลบ |
| $n(q)$ | มีกี่เอกสารที่มีคำ $q$ | คำที่พบทุกเอกสารแทบไม่มีข้อมูล |

.question[**IDF คือหัวใจ:** คำว่า "the" อยู่ในทุกเอกสาร $n(q) \approx N$ ทำให้ IDF เกือบ 0 ส่วนรหัส `E-4402` อยู่ในเอกสารเดียว IDF สูงมาก **คำหายากมีค่ามากกว่าคำที่พบบ่อย**]

# เฉลย 2.2

$$\text{RRF}(D7) = \frac{1}{60+2} + \frac{1}{60+1} = \frac{1}{62} + \frac{1}{61}
= 0.01613 + 0.01639 = \mathbf{0.03252}$$

$$\text{RRF}(D3) = \frac{1}{60+1} + \frac{1}{60+4} = \frac{1}{61} + \frac{1}{64}
= 0.01639 + 0.01563 = \mathbf{0.03202}$$

$$\text{RRF}(D1) = \frac{1}{60+3} + \frac{1}{60+2} = \frac{1}{63} + \frac{1}{62}
= 0.01587 + 0.01613 = \mathbf{0.03200}$$

**อันดับสุดท้าย:** D7 $>$ D3 $>$ D1

.question[
**สิ่งที่ต้องสังเกต:** D3 ได้ที่ 1 ในวิธี dense แต่ **แพ้ D7** ที่ได้ที่ 2 และที่ 1
เพราะ RRF ให้รางวัลกับเอกสารที่ **ทั้งสองวิธีเห็นตรงกันว่าดี**
เอกสารที่วิธีเดียวชอบมากแต่อีกวิธีไม่เห็นเลย จะแพ้เอกสารที่ทั้งคู่ค่อนข้างชอบ
]

.alert[**ทำไมต้องมี $k=60$:** มันลดความต่างระหว่างอันดับต้น ๆ ลง ถ้าไม่มี $k$ อันดับ 1 จะได้ 1.0 ส่วนอันดับ 2 ได้ 0.5 ซึ่งห่างเกินไปจนวิธีเดียวครอบงำผลได้]

# ทำไมไม่ใช้ cross-encoder ตั้งแต่แรก

.grid[
.kol-1-2[
**Bi-encoder (ขั้นค้นคืน)**

```text
embed(query)     --> vector
embed(doc)       --> vector   (ทำล่วงหน้าได้)
score = dot product
```

เอกสารถูก embed **ครั้งเดียวตอนทำดัชนี**

]

**Cross-encoder (ขั้นจัดอันดับใหม่)**

```text

```

โมเดลอ่านคำถามกับเอกสาร **ด้วยกัน**
จึงจับความสัมพันธ์ละเอียดได้ดีกว่ามาก

]

# ประเมินสองขั้นแยกกัน

.grid[
.kol-1-2[
**ขั้นค้นคืน** (วัดง่าย ไม่ต้องใช้ LLM)

$$\text{Recall@}k = \frac{|\text{ที่เกี่ยวข้อง} \cap \text{top-}k|}{|\text{ที่เกี่ยวข้อง}|}$$

$$\text{MRR} = \frac{1}{|Q|}\sum\_{i=1}^{|Q|} \frac{1}{\text{rank}\_i}$$

โดย $\text{rank}\_i$ คืออันดับของผลที่ถูกต้อง**ตัวแรก**
]
.kol-1-2[
**ขั้นสร้างคำตอบ** (มักต้องใช้ LLM ตัดสิน)

- **Faithfulness** คำตอบยึดตามบริบทหรือแต่งเอง
- **Answer relevance** ตอบตรงคำถามไหม
- **Citation accuracy** อ้างอิงชี้ไปถูกชิ้นไหม
]
]

# แบบฝึกหัด 3.1: คำนวณ Recall@k และ MRR

ระบบตอบคำถาม 4 ข้อ แต่ละข้อมีเอกสารที่เกี่ยวข้องจริงตามตาราง
ระบบคืนผลมา 5 อันดับ

| คำถาม | เอกสารที่เกี่ยวข้องจริง | ผลที่ระบบคืน (อันดับ 1 ถึง 5) |
| --- | --- | --- |
| Q1 | {D2} | D5, **D2**, D8, D1, D3 |
| Q2 | {D4, D7} | **D7**, D1, D9, **D4**, D6 |
| Q3 | {D3} | D1, D5, D8, D9, D2 |
| Q4 | {D6, D8} | D1, **D8**, D2, D5, D3 |

**ก)** Recall@5 ของแต่ละคำถาม และค่าเฉลี่ย
<br>**ข)** MRR
<br>**ค)** คำถามไหนที่ควรไปแก้ก่อน และแก้ด้วยวิธีไหน

???

ให้เวลา 7 นาที ข้อ ค คือหัวใจ Q3 ค้นไม่เจอเลย = ปัญหาคนละแบบกับ Q4

# เฉลย 3.1 (ก และ ข)

**ก) Recall@5**

| คำถาม | เจอ / ทั้งหมด | Recall@5 |
| --- | --- | --- |
| Q1 | 1/1 | 1.00 |
| Q2 | 2/2 | 1.00 |
| Q3 | 0/1 | 0.00 |
| Q4 | 1/2 | 0.50 |

$$\overline{\text{Recall@5}} = \frac{1.00+1.00+0.00+0.50}{4} = \mathbf{0.625}$$

**ข) MRR** อันดับของผลถูกต้องตัวแรก: Q1 = 2, Q2 = 1, Q3 = ไม่เจอ (นับเป็น 0), Q4 = 2

$$\text{MRR} = \frac{1}{4}\left(\frac{1}{2} + \frac{1}{1} + 0 + \frac{1}{2}\right)
= \frac{2.0}{4} = \mathbf{0.50}$$

# เฉลย 3.1 (ค): แก้อะไรก่อน

**Q3 ต้องแก้ก่อน** เพราะ recall = 0 แปลว่า **ระบบตอบคำถามนี้ไม่ได้เลย**
ต่อให้โมเดลเก่งแค่ไหน เอกสารที่ถูกต้องไม่เคยเข้าบริบท

**วิธีวินิจฉัย Q3 ตามลำดับ**

1. **D3 อยู่ในดัชนีจริงหรือไม่** ถ้าไม่ = ปัญหาที่ขั้นทำดัชนี ไม่ใช่ขั้นค้น
2. **ค้นด้วยคำในเอกสารตรง ๆ แล้วเจอไหม** ถ้าไม่เจอ = embedding model ไม่เหมาะกับภาษานี้
3. **คำถามใช้คำต่างจากเอกสารมากไหม** ถ้าใช่ = ลอง HyDE หรือ query rewriting
4. **มีรหัสหรือชื่อเฉพาะในคำถามไหม** ถ้าใช่ = เพิ่ม BM25 เข้าไปผสม

**Q4 เป็นปัญหาคนละแบบ** เจอ 1 จาก 2 ชิ้น ซึ่งอาจ **ยอมรับได้**
ถ้าชิ้นที่เจอมีข้อมูลพอตอบแล้ว การไล่ล่า recall = 1.00 ทุกข้ออาจไม่คุ้ม

.question[**บทเรียน:** recall = 0 กับ recall = 0.5 ต้องใช้วิธีแก้คนละอย่างสิ้นเชิง ค่าเฉลี่ย 0.625 เพียงตัวเดียวไม่ได้บอกอะไรเลย เหมือนเรื่อง confusion matrix เมื่อสัปดาห์ที่แล้ว]

# เมื่อไรที่ไม่ควรใช้ RAG

| สถานการณ์ | ควรใช้แทน |
| --- | --- |
| เอกสารทั้งหมดเล็กกว่า 50k โทเคน | ใส่ทั้งหมดในบริบทไปเลย ง่ายกว่าและแม่นกว่า |
| ต้องการเปลี่ยน**สไตล์**การตอบ | fine-tuning |
| คำถามต้องรวมข้อมูลจากทั้งคลัง เช่น "มีกี่ฉบับที่พูดถึง X" | ฐานข้อมูลหรือ SQL ไม่ใช่การค้นความคล้าย |
| ข้อมูลเปลี่ยนตลอดเวลาเป็นวินาที | เรียก API ตรงผ่านเครื่องมือ (สัปดาห์ที่ 11) |
| ต้องการคำตอบที่ถูกต้อง 100% | RAG ลดการหลอนแต่ไม่ได้กำจัด ต้องมีคนตรวจ |

.alert[
**ข้อที่สามอธิบายเพิ่ม:** ถ้าถามว่า "เอกสารไหนบ้างที่พูดถึงเรื่อง X"
การค้นแบบ top-k จะคืนมาแค่ 5 ชิ้นเสมอ **ต่อให้มี 200 ชิ้นที่เกี่ยวข้อง**
คำถามเชิงรวม (aggregate) ต้องใช้เครื่องมือคนละชนิด ไม่ใช่การค้นความคล้าย

# สรุป

- RAG แก้ปัญหา วันตัดความรู้ ข้อมูลส่วนตัว และการหลอน ด้วยการค้นก่อนตอบ
- ไปป์ไลน์: แบ่งชิ้น, ฝังตัว, จัดดัชนี, ค้นคืน, จัดอันดับใหม่, สร้างคำตอบ
- **คุณภาพถูกจำกัดที่ขั้นค้นคืน** ปรับปรุงที่นั่นให้คุ้มก่อน
- โคไซน์วัดทิศทาง, BM25 ชนะเรื่องคำหายาก, **RRF รวมจุดแข็งของทั้งสอง**
- การจัดอันดับใหม่ด้วย cross-encoder แม่นกว่าแต่ขยายขนาดไม่ได้ จึงต้องทำสองขั้น
- **ประเมินขั้นค้นคืนแยกจากขั้นสร้างคำตอบ** และดูรายคำถาม ไม่ใช่แค่ค่าเฉลี่ย
- เมทาดาทาและการอ้างอิงคือสิ่งที่ทำให้ระบบ **ตรวจสอบได้**
