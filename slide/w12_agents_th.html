# นิยามเชิงปฏิบัติ

> **เอเจนต์คือ LLM ที่ทำงานในลูป โดยเลือกใช้เครื่องมือเองจนกว่างานจะเสร็จ**

องค์ประกอบที่ขาดไม่ได้ 5 อย่าง

.grid[
.kol-1-2[
1. **โมเดล** ทำหน้าที่คิดและตัดสินใจ
2. **เครื่องมือ** ทำให้ลงมือทำได้จริง (MCP จากสัปดาห์ที่แล้ว)
3. **ลูป** ทำซ้ำจนกว่าจะบรรลุเป้าหมาย
]
.kol-1-2[
4. **หน่วยความจำ** จำสิ่งที่ทำไปแล้ว
5. **เงื่อนไขหยุด** สำคัญที่สุดและถูกลืมบ่อยที่สุด
]
]

.alert[
**ระวังคำโฆษณา:** ระบบจำนวนมากที่เรียกตัวเองว่า "AI agent" จริง ๆ แล้วเป็น
**เวิร์กโฟลว์** ที่มีลำดับขั้นตายตัว ความต่างคือ **ใครเป็นคนตัดสินใจว่าจะทำอะไรต่อ**
ถ้าโปรแกรมเมอร์กำหนดไว้ล่วงหน้า นั่นคือเวิร์กโฟลว์ ถ้าโมเดลเลือกเอง นั่นคือเอเจนต์
]

# เวิร์กโฟลว์กับเอเจนต์: เลือกอย่างไร

| | เวิร์กโฟลว์ | เอเจนต์ |
| --- | --- | --- |
| ลำดับขั้น | กำหนดไว้ล่วงหน้า | โมเดลตัดสินใจตอนรัน |
| คาดเดาได้ | สูง | ต่ำ |
| ต้นทุน | คงที่ ประมาณได้ | แปรผัน อาจบานปลาย |
| ดีบักง่าย | ง่าย | ยาก |
| ทดสอบ | เขียน unit test ได้ตรง ๆ | ต้องมีชุดทดสอบเชิงพฤติกรรม |
| เหมาะกับ | งานที่รู้ขั้นตอนแน่นอน | งานที่ขั้นตอนขึ้นกับสิ่งที่เจอ |

.question[
**คำแนะนำที่ควรยึด:** เริ่มจากสิ่งที่ง่ายที่สุดที่แก้ปัญหาได้
<br>เรียก LLM ครั้งเดียวพอไหม $\to$ ถ้าไม่พอ ลองเวิร์กโฟลว์ $\to$ ถ้ายังไม่พอจึงใช้เอเจนต์
<br>**อย่าใช้เอเจนต์เพราะมันฟังดูทันสมัย**
]

เราจะพูดถึงรูปแบบเวิร์กโฟลว์อย่างละเอียดในสัปดาห์หน้า

# โปรโตคอลการเรียกเครื่องมือ

โมเดลไม่ได้รันโค้ดเอง มันแค่**ขอ**ให้เรารันแล้วส่งผลกลับไป

```text
1. เราส่ง: ข้อความ + รายการเครื่องมือ (JSON Schema)
2. โมเดลตอบ: "ขอเรียก search_arxiv(query='attention', max=5)"
3. เรารันฟังก์ชันนั้นจริง ๆ ในโปรแกรมของเรา
4. เราส่งผลลัพธ์กลับเข้าไปเป็นข้อความบทบาท tool
5. โมเดลอ่านผล แล้วตอบ หรือขอเรียกเครื่องมืออีก
```

.alert[
**ประเด็นความปลอดภัยที่ต้องเข้าใจ:** ขั้นที่ 3 คือ**โค้ดของเรา** ที่ตัดสินใจว่าจะรันหรือไม่รัน
โมเดลไม่มีอำนาจอะไรเลยนอกจากที่เราให้ ทุกการควบคุมเกิดขึ้นที่บรรทัดนี้
]

**สิ่งที่ต้องเข้าใจให้ลึก:** เมื่อโมเดล "ขอเรียกเครื่องมือ" มันแค่สร้างโทเคนที่มีรูปแบบพิเศษ
ตามที่ถูกฝึกมา มันไม่ได้ "รู้" ว่าเครื่องมือมีอยู่จริงหรือไม่
นี่คือเหตุผลที่มันแต่งชื่อเครื่องมือขึ้นมาเองได้

# ลูปของเอเจนต์ เขียนเองได้ใน 25 บรรทัด

```python
def run_agent(user_msg, tools, registry, max_steps=10, budget=0.50):
    messages = [{"role": "system", "content": SYSTEM_PROMPT},
                {"role": "user", "content": user_msg}]
    spent = 0.0

    for step in range(max_steps):                      # เงื่อนไขหยุดที่ 1
        resp = client.chat.completions.create(
            model=MODEL, messages=messages, tools=tools)
        msg = resp.choices[0].message
        messages.append(msg)
        spent += estimate_cost(resp.usage)

        if not msg.tool_calls:                         # เงื่อนไขหยุดที่ 2
            return msg.content                         # โมเดลตอบแล้ว จบงาน
        if spent > budget:                             # เงื่อนไขหยุดที่ 3
            return "หยุดเพราะเกินงบประมาณ"

        for call in msg.tool_calls:
            args = json.loads(call.function.arguments)
            result = registry[call.function.name](**args)   # รันจริงที่บรรทัดนี้
            messages.append({"role": "tool", "tool_call_id": call.id,
                             "content": str(result)[:4000]})  # ตัดผลไม่ให้ยาวเกิน
    return "หยุดเพราะครบจำนวนขั้นสูงสุด"
```

.alert[**สังเกตเงื่อนไขหยุด 3 ชั้น** เอเจนต์ที่ไม่มีเพดานจำนวนขั้นและงบประมาณ คือบั๊กที่รอเกิด ไม่ใช่คุณสมบัติ]

# แบบฝึกหัด 1.1: ไล่ลูปด้วยมือ

เอเจนต์มีเครื่องมือ `get_price(item)` และ `convert(amount, to)`
งบประมาณ 0.10 USD ค่าเรียกโมเดลครั้งละ 0.03 USD เพดาน 5 ขั้น

ผู้ใช้ถาม: **"หนังสือเล่มนี้ราคาเท่าไรเป็นเงินบาท"**

โมเดลตอบตามลำดับนี้

```text
รอบ 1: ขอเรียก get_price(item="หนังสือ")     -> ผลลัพธ์ "29.99 USD"
รอบ 2: ขอเรียก convert(amount=29.99, to="THB") -> ผลลัพธ์ "1,050 THB"
รอบ 3: ขอเรียก convert(amount=29.99, to="THB") -> ผลลัพธ์ "1,050 THB"
รอบ 4: ขอเรียก convert(amount=29.99, to="THB") -> ...
```

**ก)** ลูปจบที่รอบไหน ด้วยเงื่อนไขข้อใด
<br>**ข)** เกิดอะไรขึ้นกับโมเดล และทำไม
<br>**ค)** เพิ่มการควบคุมอะไรเพื่อกันปัญหานี้

???

คำตอบ ก: รอบ 4 ด้วยงบประมาณ (0.12 > 0.10) ก่อนถึงเพดานขั้น

# เฉลย 1.1

**ก) จบที่รอบ 4 ด้วยเงื่อนไขงบประมาณ**

| รอบ | ค่าใช้จ่ายสะสม | เช็คงบ (> 0.10) |
| --- | --- | --- |
| 1 | 0.03 | ไม่เกิน |
| 2 | 0.06 | ไม่เกิน |
| 3 | 0.09 | ไม่เกิน |
| 4 | **0.12** | **เกิน หยุด** |

เพดาน 5 ขั้นยังไม่ถูกใช้เลย **งบประมาณเป็นเงื่อนไขที่ทำงานก่อน**

**ข) โมเดลติดลูป** เพราะเรียกเครื่องมือเดิมด้วยอาร์กิวเมนต์เดิมซ้ำ ๆ
สาเหตุที่พบบ่อยคือ ผลลัพธ์ที่คืนมาไม่ได้ตอบคำถามในรูปแบบที่โมเดลคาดหวัง
หรือพรอมป์ตระบบไม่ได้บอกว่า "เมื่อได้ข้อมูลครบแล้วให้ตอบ"

**ค) การควบคุมที่ควรเพิ่ม**

1. **ตรวจจับการเรียกซ้ำ** เก็บ `(ชื่อเครื่องมือ, อาร์กิวเมนต์)` ที่เคยเรียก
ถ้าซ้ำให้คืนข้อความว่า "คุณเรียกสิ่งนี้ไปแล้ว ผลลัพธ์คือ ... ให้ตอบผู้ใช้ได้แล้ว"
2. เพิ่มในพรอมป์ตระบบว่า "เมื่อได้ข้อมูลครบให้ตอบทันที อย่าเรียกเครื่องมือซ้ำ"

# สรุปชั่วโมงที่ 1

- เอเจนต์ = โมเดล + เครื่องมือ + ลูป + หน่วยความจำ + **เงื่อนไขหยุด**
- ความต่างจากเวิร์กโฟลว์คือ **ใครตัดสินใจว่าจะทำอะไรต่อ**
- **เริ่มจากวิธีที่ง่ายที่สุดเสมอ** อย่าใช้เอเจนต์ถ้าเวิร์กโฟลว์พอ
- โมเดลไม่ได้รันอะไรเอง **โค้ดของเรา**เป็นผู้ตัดสินใจรัน จึงเป็นจุดควบคุมทุกอย่าง
- โมเดลแค่สร้างโทเคนที่มีรูปแบบพิเศษ **มันจึงแต่งชื่อเครื่องมือขึ้นมาเองได้**
- ต้องมีเงื่อนไขหยุดอย่างน้อย 3 ชั้น: จำนวนขั้น, โมเดลตอบแล้ว, งบประมาณ
- การติดลูปคือโหมดล้มเหลวที่พบบ่อยที่สุด ต้องตรวจจับการเรียกซ้ำ

# ReAct: ให้เหตุผลสลับกับลงมือทำ

**ทำไมได้ผล:** การเขียนเหตุผลออกมาก่อนเรียกเครื่องมือ ทำให้โมเดล

- เลือกเครื่องมือได้ตรงขึ้น (มี "พื้นที่คำนวณ" ตามที่คุยกันสัปดาห์ที่ 9)
- ตรวจจับได้ว่าผลลัพธ์ไม่สมเหตุสมผล
- และให้เรา **ดีบักได้** เพราะเห็นว่ามันคิดผิดตรงไหน

.alert[
**ข้อสามสำคัญที่สุดในทางปฏิบัติ**
เมื่อเอเจนต์ทำงานผิด คำถามแรกคือ "มันคิดอะไรอยู่ตอนนั้น"
ถ้าไม่มีร่องรอยความคิด คุณจะเห็นแค่ว่ามันเรียกเครื่องมือผิด แต่ไม่รู้ว่าทำไม
**บันทึกร่องรอยทุกขั้นเสมอ แม้จะใช้โมเดลที่คิดเองได้แล้ว**
]

.footnote[โมเดลรุ่นใหม่ทำ ReAct ได้เองโดยไม่ต้องสั่ง แต่ร่องรอยยังจำเป็นสำหรับการดีบัก และเราจะใช้มันเป็นหลักฐานในสัปดาห์ที่ 14 ตอนทำ observability]

# รูปแบบและจุดที่ควรใช้

| รูปแบบ | ได้อะไร | เสียอะไร | ใช้เมื่อ |
| --- | --- | --- | --- |
| **วางแผนก่อนแล้วค่อยทำ** | เห็นภาพรวม ตรวจแผนก่อนได้ | แผนล้าสมัยเมื่อเจอสิ่งไม่คาดคิด | งานที่ขั้นตอนค่อนข้างแน่นอน |
| **สะท้อนตัวเอง** | คุณภาพสูงขึ้นชัดเจน | จ่ายค่าโทเคน 2 ถึง 3 เท่า | งานเขียน งานเขียนโค้ด |
| **ตัวจัดเส้นทาง** | ถูกและเร็วมาก | ต้องรู้ประเภทคำขอล่วงหน้า | ระบบจริงที่มีคำขอหลากหลาย |
| **ผู้ประสานงานกับผู้ปฏิบัติ** | ประหยัดบริบทของตัวหลัก | ประสานงานยาก แพงขึ้น | งานสำรวจที่ต้องอ่านข้อมูลมาก |

.question[
**เงื่อนไขที่ทำให้ "สะท้อนตัวเอง" ได้ผลจริง:** ผู้วิจารณ์ต้องเก่งกว่าหรือมีข้อมูลมากกว่าผู้สร้าง
<br>ถ้าให้โมเดลเดิมวิจารณ์งานตัวเองในสิ่งที่มันทำไม่ได้ตั้งแต่แรก มันจะวนอยู่กับที่และจ่ายเงินเพิ่มเปล่า ๆ
<br>**การใช้ผลจากเทสหรือ linter เป็นผู้วิจารณ์ ได้ผลดีกว่ามาก** เพราะเป็นความจริงภายนอก
]

# เอเจนต์หลายตัว: ใช้เมื่อไร

**ได้ผลดีเมื่อ:** งานย่อยเป็นอิสระต่อกัน และแต่ละงานต้องอ่านข้อมูลจำนวนมาก
เอเจนต์ย่อยกลืนข้อมูลไว้ในบริบทตัวเอง ส่งกลับมาแค่ข้อสรุป

```text
เอเจนต์หลัก: "หาว่าโค้ดเบสนี้จัดการ authentication อย่างไร"
   --> ย่อย 1: อ่าน 30 ไฟล์ในโฟลเดอร์ auth    --> คืนสรุป 15 บรรทัด
   --> ย่อย 2: อ่าน 20 ไฟล์ทดสอบ              --> คืนสรุป 10 บรรทัด
   --> ย่อย 3: ค้นเอกสารในเว็บ                --> คืนสรุป 8 บรรทัด

บริบทของเอเจนต์หลักโตขึ้นแค่ 33 บรรทัด แทนที่จะเป็น 50 ไฟล์
```

.alert[
**ไม่ได้ผลเมื่อ:** งานต้องประสานกันแน่นแฟ้น เอเจนต์ย่อยมองไม่เห็นบริบทของกันและกัน
จึงทำงานทับซ้อนหรือขัดแย้งกัน และค่าใช้จ่ายเพิ่มหลายเท่า
<br>**เอเจนต์เดียวที่ออกแบบดี ชนะเอเจนต์หลายตัวที่ออกแบบลวก ๆ เกือบทุกครั้ง**
]

# โหมดล้มเหลวที่พบบ่อย

| อาการ | สาเหตุ | ทางแก้ |
| --- | --- | --- |
| **วนลูปไม่จบ** | เรียกเครื่องมือเดิมซ้ำ ๆ ด้วยอาร์กิวเมนต์เดิม | ตรวจจับการเรียกซ้ำ, เพดานจำนวนขั้น |
| **เครื่องมือที่ไม่มีจริง** | โมเดลแต่งชื่อฟังก์ชันขึ้นมา | ตรวจชื่อกับ registry แล้วส่งข้อความผิดพลาดที่ช่วยแก้ |
| **บริบทล้น** | ผลลัพธ์เครื่องมือยาวสะสมจนเต็ม | ตัดผลลัพธ์, สรุปทับ, ถ่ายลงไฟล์ |
| **ค่าใช้จ่ายบานปลาย** | ไม่มีงบประมาณกำกับ | นับต้นทุนสะสมแล้วหยุดเมื่อเกิน |
| **มั่นใจแต่ผิด** | โมเดลรายงานว่าสำเร็จทั้งที่ไม่ | ตรวจผลด้วยโปรแกรม ไม่เชื่อคำรายงาน |
| **ทำสิ่งที่ย้อนกลับไม่ได้** | มีสิทธิ์เขียนหรือลบโดยไม่มีการอนุมัติ | แยกเครื่องมืออ่านกับเขียน, ให้คนอนุมัติ |

.alert[
**ข้อที่ร้ายที่สุดคือ "มั่นใจแต่ผิด"** เพราะระบบไม่แจ้งเตือนอะไรเลย
เอเจนต์บอกว่า "แก้บั๊กเรียบร้อยแล้วครับ" ทั้งที่ยังไม่ได้รันเทส

# การควบคุมที่ต้องมีในระบบจริง

```python
READ_ONLY = {"search_arxiv", "read_file", "query_db"}

def execute(call, registry, auto_approve=True):
    name = call.function.name
    if name not in registry:                          # 1. ตรวจว่ามีจริง
        return f"ไม่มีเครื่องมือชื่อ {name} เครื่องมือที่มีคือ {list(registry)}"

    args = validate(json.loads(call.function.arguments), SCHEMA[name])  # 2. ตรวจอาร์กิวเมนต์

    if name not in READ_ONLY and not auto_approve:    # 3. ขออนุมัติสำหรับการเขียน
        if not ask_human(f"อนุญาตให้ {name}({args}) หรือไม่"):
            return "ผู้ใช้ปฏิเสธการดำเนินการนี้"

    try:
        return str(registry[name](**args))[:4000]     # 4. จำกัดขนาดผลลัพธ์
    except Exception as e:
        return f"เครื่องมือทำงานผิดพลาด: {e}"          # 5. ส่งข้อผิดพลาดกลับ ไม่ใช่ให้โปรแกรมตาย
```

.question[
ข้อ 5 สำคัญกว่าที่คิด: การส่งข้อความผิดพลาดกลับเข้าไปในบริบท
ทำให้โมเดล**แก้ตัวเองได้** เช่น เปลี่ยนอาร์กิวเมนต์แล้วลองใหม่
ถ้าโปรแกรมพังไปเลย เอเจนต์จะไม่มีโอกาสนั้น
**นี่คือรูปแบบเดียวกับ retry loop ในสัปดาห์ที่ 9**
]

# การประเมินเอเจนต์

ต่างจากการประเมินพรอมป์ต เพราะเราสนใจ**เส้นทาง**ไม่ใช่แค่คำตอบสุดท้าย

# เฉลย 3.1

```python
# ก) ต้องรันเทสจริง ไม่เชื่อคำรายงานของเอเจนต์
def check_a(out, trace):
    r = subprocess.run(["pytest", "tests/test_parser.py", "-q"],
                       capture_output=True, text=True)
    return r.returncode == 0        # ความจริงภายนอก ไม่ใช่ข้อความจากโมเดล

# ข) ตรวจทั้งผลลัพธ์และเส้นทาง
def check_b(out, trace):
    called = [t["args"]["symbol"] for t in trace if t.get("tool") == "get_price"]
    if set(called) != {"AAPL", "MSFT", "NVDA"}:
        return False                # ต้องเรียกครบ ไม่ใช่เดาราคาจากความจำ
    prices = {t["args"]["symbol"]: parse_price(t["result"]) for t in trace
              if t.get("tool") == "get_price"}
    return max(prices, key=prices.get) in out    # ตอบตัวที่แพงสุดจริง

# ค) ตรวจข้อจำกัดที่วัดได้
def check_c(out, trace):
    return (len(out.split()) <= 100
            and re.search(r"\[หน้า \d+\]", out) is not None)
```

.alert[
**ข้อ ก คือหัวใจ** เอเจนต์อาจตอบว่า "แก้แล้ว เทสผ่านหมด" ทั้งที่ไม่เคยรันเทสเลย
การตรวจต้องเป็น **ความจริงภายนอก** ที่เอเจนต์ควบคุมไม่ได้
<br>ข้อ ข แสดงว่าเราต้องตรวจ **เส้นทาง** ด้วย เพราะเอเจนต์อาจได้คำตอบถูกโดยบังเอิญ
จากการเดาราคาจากความจำ ซึ่งจะพังทันทีเมื่อราคาเปลี่ยน

# สรุป

- เอเจนต์ = โมเดล + เครื่องมือ + ลูป + หน่วยความจำ + **เงื่อนไขหยุด**
- **โค้ดของเรา**เป็นผู้ตัดสินใจรัน จึงเป็นจุดที่ควบคุมทุกอย่าง
- ทุกเอเจนต์ต้องมีเพดานจำนวนขั้น งบประมาณ และการตรวจสอบอาร์กิวเมนต์
- **ส่ง error กลับให้โมเดลแก้ อย่าให้โปรแกรมพัง**
- แยกเครื่องมืออ่านออกจากเครื่องมือเขียน และให้มนุษย์อนุมัติสิ่งที่ย้อนกลับไม่ได้
- เอเจนต์หลายตัวช่วยได้เมื่องานย่อยเป็นอิสระและกินบริบทมาก
- **ประเมินด้วยความจริงภายนอก ไม่ใช่คำรายงานของเอเจนต์** และตรวจทั้งผลลัพธ์และเส้นทาง
