# นิยามเชิงปฏิบัติ

> **เอเจนต์คือ LLM ที่ทำงานในลูป โดยเลือกใช้เครื่องมือเองจนกว่างานจะเสร็จ**

องค์ประกอบที่ขาดไม่ได้ 5 อย่าง

.grid[
.kol-1-2[
1. **โมเดล** ทำหน้าที่คิดและตัดสินใจ
2. **เครื่องมือ** ทำให้ลงมือทำได้จริง (MCP จากสัปดาห์ที่แล้ว)
3. **ลูป** ทำซ้ำจนกว่าจะบรรลุเป้าหมาย
]
.kol-1-2[
4. **หน่วยความจำ** จำสิ่งที่ทำไปแล้ว
5. **เงื่อนไขหยุด** สำคัญที่สุดและถูกลืมบ่อยที่สุด
]
]

.alert[
**ระวังคำโฆษณา:** ระบบจำนวนมากที่เรียกตัวเองว่า "AI agent" จริง ๆ แล้วเป็น
**เวิร์กโฟลว์** ที่มีลำดับขั้นตายตัว ความต่างคือ **ใครเป็นคนตัดสินใจว่าจะทำอะไรต่อ**
ถ้าโปรแกรมเมอร์กำหนดไว้ล่วงหน้า นั่นคือเวิร์กโฟลว์ ถ้าโมเดลเลือกเอง นั่นคือเอเจนต์
]

---

# เวิร์กโฟลว์กับเอเจนต์: เลือกอย่างไร

| | เวิร์กโฟลว์ | เอเจนต์ |
| --- | --- | --- |
| ลำดับขั้น | กำหนดไว้ล่วงหน้า | โมเดลตัดสินใจตอนรัน |
| คาดเดาได้ | สูง | ต่ำ |
| ต้นทุน | คงที่ ประมาณได้ | แปรผัน อาจบานปลาย |
| ดีบักง่าย | ง่าย | ยาก |
| เหมาะกับ | งานที่รู้ขั้นตอนแน่นอน | งานที่ขั้นตอนขึ้นกับสิ่งที่เจอ |

.question[
**คำแนะนำที่ควรยึด:** เริ่มจากสิ่งที่ง่ายที่สุดที่แก้ปัญหาได้
เรียก LLM ครั้งเดียวพอไหม ถ้าไม่พอ ลองเวิร์กโฟลว์ ถ้ายังไม่พอจึงใช้เอเจนต์
**อย่าใช้เอเจนต์เพราะมันฟังดูทันสมัย**
]

เราจะพูดถึงรูปแบบเวิร์กโฟลว์อย่างละเอียดในสัปดาห์หน้า

# โปรโตคอลการเรียกเครื่องมือ

โมเดลไม่ได้รันโค้ดเอง มันแค่**ขอ**ให้เรารันแล้วส่งผลกลับไป

```text
1. เราส่ง: ข้อความ + รายการเครื่องมือ (JSON Schema)
2. โมเดลตอบ: "ขอเรียก search_arxiv(query='attention', max=5)"
3. เรารันฟังก์ชันนั้นจริง ๆ ในโปรแกรมของเรา
4. เราส่งผลลัพธ์กลับเข้าไปเป็นข้อความบทบาท tool
5. โมเดลอ่านผล แล้วตอบ หรือขอเรียกเครื่องมืออีก
```

.alert[
**ประเด็นความปลอดภัยที่ต้องเข้าใจ:** ขั้นที่ 3 คือ**โค้ดของเรา** ที่ตัดสินใจว่าจะรันหรือไม่รัน
โมเดลไม่มีอำนาจอะไรเลยนอกจากที่เราให้ ทุกการควบคุมเกิดขึ้นที่บรรทัดนี้
]

---

# นิยามเครื่องมือ

```python
tools = [{
    "type": "function",
    "function": {
        "name": "search_arxiv",
        "description": "ค้นบทความวิชาการจาก arXiv ใช้เมื่อผู้ใช้ถามถึงงานวิจัย "
                       "หรือต้องการอ้างอิงทางวิชาการ ห้ามใช้กับคำถามทั่วไป",
        "parameters": {
            "type": "object",
            "properties": {
                "query": {"type": "string", "description": "คำค้นภาษาอังกฤษ"},
                "max_results": {"type": "integer", "default": 5, "maximum": 20},
            },
            "required": ["query"],
        },
    },
}]
```

.question[
`description` คือ **พรอมป์ต** ที่โมเดลใช้ตัดสินใจ
ประโยค "ใช้เมื่อ..." และ "ห้ามใช้กับ..." มีผลต่อความแม่นยำมากกว่าการอธิบายว่าฟังก์ชันทำอะไร
]

.footnote[ถ้าใช้ MCP จากสัปดาห์ที่แล้ว ไคลเอนต์จะสร้างสคีมานี้ให้อัตโนมัติจาก type hint และ docstring]

# ลูปของเอเจนต์ เขียนเองได้ใน 25 บรรทัด

```python
def run_agent(user_msg, tools, registry, max_steps=10, budget=0.50):
    messages = [{"role": "system", "content": SYSTEM_PROMPT},
                {"role": "user", "content": user_msg}]
    spent = 0.0

    for step in range(max_steps):                      # เงื่อนไขหยุดที่ 1
        resp = client.chat.completions.create(
            model=MODEL, messages=messages, tools=tools)
        msg = resp.choices[0].message
        messages.append(msg)
        spent += estimate_cost(resp.usage)

        if not msg.tool_calls:                         # เงื่อนไขหยุดที่ 2
            return msg.content                         # โมเดลตอบแล้ว จบงาน
        if spent > budget:                             # เงื่อนไขหยุดที่ 3
            return "หยุดเพราะเกินงบประมาณ"

        for call in msg.tool_calls:
            args = json.loads(call.function.arguments)
            result = registry[call.function.name](**args)   # รันจริงที่บรรทัดนี้
            messages.append({"role": "tool", "tool_call_id": call.id,
                             "content": str(result)[:4000]})  # ตัดผลไม่ให้ยาวเกิน
    return "หยุดเพราะครบจำนวนขั้นสูงสุด"
```

.alert[**สังเกตเงื่อนไขหยุด 3 ชั้น** เอเจนต์ที่ไม่มีเพดานจำนวนขั้นและงบประมาณ คือบั๊กที่รอเกิด ไม่ใช่คุณสมบัติ]

# ReAct: ให้เหตุผลสลับกับลงมือทำ

```text
คิด:  ผู้ใช้ถามว่างานวิจัยล่าสุดเรื่อง attention มีอะไรบ้าง
      ฉันไม่รู้เรื่องหลังวันตัดความรู้ ต้องค้นก่อน
ทำ:   search_arxiv(query="efficient attention", max_results=5)
เห็น: [รายการบทความ 5 ชิ้น พร้อมบทคัดย่อ]
คิด:  มี 3 ชิ้นที่เกี่ยวข้องโดยตรง ควรอ่านรายละเอียดชิ้นที่ 2
ทำ:   fetch_abstract(id="2601.04521")
เห็น: [บทคัดย่อเต็ม]
คิด:  ข้อมูลพอแล้ว สรุปตอบได้
ตอบ:  ...
```

**ทำไมได้ผล:** การเขียนเหตุผลออกมาก่อนเรียกเครื่องมือ ทำให้โมเดล

- เลือกเครื่องมือได้ตรงขึ้น
- ตรวจจับได้ว่าผลลัพธ์ไม่สมเหตุสมผล
- และให้เรา**ดีบักได้** เพราะเห็นว่ามันคิดผิดตรงไหน

.footnote[โมเดลรุ่นใหม่ทำ ReAct ได้เองโดยไม่ต้องสั่ง แต่การบันทึกร่องรอยความคิดไว้ยังจำเป็นสำหรับการดีบัก]

# รูปแบบอื่นที่ใช้บ่อย

.grid[
.kol-1-2[
**วางแผนก่อนแล้วค่อยทำ**
<br>ให้โมเดลเขียนแผนทั้งหมดก่อน แล้วจึงทำทีละขั้น

ดี: เห็นภาพรวม ประหยัดกว่า ตรวจแผนก่อนได้
<br>เสีย: แผนอาจล้าสมัยเมื่อเจอสิ่งไม่คาดคิด

**สะท้อนตัวเอง (Reflection)**
<br>ทำงาน แล้วให้โมเดลวิจารณ์ผลงานตัวเอง แล้วแก้

ดี: คุณภาพสูงขึ้นชัดเจนในงานเขียนและเขียนโค้ด
<br>เสีย: จ่ายค่าโทเคน 2 ถึง 3 เท่า
]
.kol-1-2[
**ตัวจัดเส้นทาง (Router)**
<br>โมเดลเล็กจำแนกว่าคำถามประเภทไหน แล้วส่งต่อให้ตัวจัดการที่เหมาะสม

ดี: ถูกและเร็ว เหมาะกับระบบจริง

**ผู้ประสานงานกับผู้ปฏิบัติ**
<br>เอเจนต์หลักแตกงานเป็นงานย่อย ส่งให้เอเจนต์ย่อยทำในบริบทของตัวเอง แล้วรับแต่ผลสรุปกลับมา

ดี: ประหยัดบริบทของเอเจนต์หลักมาก
]
]

| อาการ | สาเหตุ | ทางแก้ |
| --- | --- | --- |
| **วนลูปไม่จบ** | เรียกเครื่องมือเดิมซ้ำ ๆ ด้วยอาร์กิวเมนต์เดิม | ตรวจจับการเรียกซ้ำ, เพดานจำนวนขั้น |
| **เครื่องมือที่ไม่มีจริง** | โมเดลแต่งชื่อฟังก์ชันขึ้นมา | ตรวจชื่อกับ registry แล้วส่งข้อความผิดพลาดที่ช่วยแก้ |
| **บริบทล้น** | ผลลัพธ์เครื่องมือยาวสะสมจนเต็ม | ตัดผลลัพธ์, สรุปทับ, ถ่ายลงไฟล์ |
| **ค่าใช้จ่ายบานปลาย** | ไม่มีงบประมาณกำกับ | นับต้นทุนสะสมแล้วหยุดเมื่อเกิน |
| **มั่นใจแต่ผิด** | โมเดลรายงานว่าสำเร็จทั้งที่ไม่ | ตรวจผลด้วยโปรแกรม ไม่เชื่อคำรายงาน |
| **ทำสิ่งที่ย้อนกลับไม่ได้** | มีสิทธิ์เขียนหรือลบโดยไม่มีการอนุมัติ | แยกเครื่องมืออ่านกับเขียน, ให้คนอนุมัติ |

.alert[**ข้อที่ร้ายที่สุดคือ "มั่นใจแต่ผิด"** เพราะระบบไม่แจ้งเตือนอะไรเลย ให้ตรวจสอบผลลัพธ์ด้วยเงื่อนไขที่เขียนเป็นโปรแกรมได้เสมอ]

# การควบคุมที่ต้องมีในระบบจริง

```python
READ_ONLY = {"search_arxiv", "read_file", "query_db"}

def execute(call, registry, auto_approve=True):
    name = call.function.name
    if name not in registry:                          # 1. ตรวจว่ามีจริง
        return f"ไม่มีเครื่องมือชื่อ {name} เครื่องมือที่มีคือ {list(registry)}"

    args = validate(json.loads(call.function.arguments), SCHEMA[name])  # 2. ตรวจอาร์กิวเมนต์

    if name not in READ_ONLY and not auto_approve:    # 3. ขออนุมัติสำหรับการเขียน
        if not ask_human(f"อนุญาตให้ {name}({args}) หรือไม่"):
            return "ผู้ใช้ปฏิเสธการดำเนินการนี้"

    try:
        return str(registry[name](**args))[:4000]     # 4. จำกัดขนาดผลลัพธ์
    except Exception as e:
        return f"เครื่องมือทำงานผิดพลาด: {e}"          # 5. ส่งข้อผิดพลาดกลับ ไม่ใช่ให้โปรแกรมตาย
```

ทำให้โมเดล**แก้ตัวเองได้** เช่น เปลี่ยนอาร์กิวเมนต์แล้วลองใหม่
ถ้าโปรแกรมพังไปเลย เอเจนต์จะไม่มีโอกาสนั้น

# เอเจนต์หลายตัว: ใช้เมื่อไร

```text
              +------------------+
              |  ผู้ประสานงาน     |
              +---+----+-----+---+
                  |    |     |
       +----------+    |     +----------+
       v               v                v
  +---------+    +---------+     +---------+
  | ค้นเอกสาร|    | ค้นเว็บ  |     | วิเคราะห์|
  | (บริบท  |    | (บริบท   |     | ข้อมูล   |
  |  ของตัว) |    |  ของตัว) |     |         |
  +----+----+    +----+----+     +----+----+
       |              |               |
       +--------> สรุปสั้น ๆ กลับมา <---+
```

**ได้ผลดีเมื่อ:** งานย่อยเป็นอิสระต่อกัน และแต่ละงานต้องอ่านข้อมูลจำนวนมาก
เอเจนต์ย่อยกลืนข้อมูลไว้ในบริบทตัวเอง ส่งกลับมาแค่ข้อสรุป

.alert[
**ไม่ได้ผลเมื่อ:** งานต้องประสานกันแน่นแฟ้น เอเจนต์ย่อยมองไม่เห็นบริบทของกันและกัน
จึงทำงานทับซ้อนหรือขัดแย้งกัน และค่าใช้จ่ายเพิ่มหลายเท่า
**เอเจนต์เดียวที่ออกแบบดี ชนะเอเจนต์หลายตัวที่ออกแบบลวก ๆ เกือบทุกครั้ง**

# สรุป

- เอเจนต์ = โมเดล + เครื่องมือ + ลูป + หน่วยความจำ + **เงื่อนไขหยุด**
- ความต่างจากเวิร์กโฟลว์คือ **ใครตัดสินใจว่าจะทำอะไรต่อ**
- เริ่มจากวิธีที่ง่ายที่สุดเสมอ อย่าใช้เอเจนต์ถ้าเวิร์กโฟลว์พอ
- โมเดลไม่ได้รันอะไรเอง **โค้ดของเรา**เป็นผู้ตัดสินใจรัน จึงเป็นจุดที่ควบคุมทุกอย่าง
- ทุกเอเจนต์ต้องมีเพดานจำนวนขั้น งบประมาณ และการตรวจสอบอาร์กิวเมนต์
- แยกเครื่องมืออ่านออกจากเครื่องมือเขียน และให้มนุษย์อนุมัติสิ่งที่ย้อนกลับไม่ได้
- เอเจนต์หลายตัวช่วยได้เมื่องานย่อยเป็นอิสระและกินบริบทมาก
