## หลักการของอรรถประโยชน์คาดหวังสูงสุด (Principle of maximum expected utility)

เอเจนต์จะถูกเรียกว่ามีเหตุผล (rational) ถ้าหากเลือกกระทำที่ให้ **อรรถประโยชน์คาดหวัง (expected utility) สูงสุด** โดยเฉลี่ยจากผลลัพธ์ที่เป็นไปได้ทั้งหมดของการกระทำนั้น

.question[คำว่า "คาดหวัง" (expected) หมายถึงอะไรกันแน่?]

# ความไม่แน่นอน (Uncertainty)

สถานการณ์ทั่วไป:
- ตัวแปรที่*สังเกตได้*หรือหลักฐาน (Observed variables or evidence): เอเจนต์รู้ข้อมูลบางอย่างเกี่ยวกับสถานะของโลก (เช่น ค่าที่อ่านได้จากเซ็นเซอร์)
- **ตัวแปรที่สังเกตไม่ได้** (Unobserved variables): เอเจนต์ต้องให้เหตุผลเกี่ยวกับแง่มุมอื่นๆ ที่ไม่แน่นอน (เช่น ผีอยู่ที่ไหน)
- *แบบจำลอง* (เชิงความน่าจะเป็น) (Probabilistic model): เอเจนต์รู้หรือเชื่อบางอย่างเกี่ยวกับความสัมพันธ์ระหว่างตัวแปรที่สังเกตได้กับตัวแปรที่สังเกตไม่ได้

**การให้เหตุผลเชิงความน่าจะเป็น (Probabilistic reasoning)** เป็นกรอบการทำงานสำหรับจัดการความรู้และความเชื่อของเรา

---

# การยืนยันเชิงความน่าจะเป็น (Probabilistic assertions)

การยืนยันเชิงความน่าจะเป็นแสดงถึงการที่เอเจนต์ไม่สามารถตัดสินใจได้อย่างชัดเจนเกี่ยวกับความจริงของข้อเสนอหนึ่งๆ
- ค่าความน่าจะเป็น **สรุป** ผลกระทบของ
    - *ความไม่รู้* (ignorance) (ทางทฤษฎี, ทางปฏิบัติ)
    - *ความขี้เกียจ* (laziness) (ขาดเวลา, ทรัพยากร)
- ความน่าจะเป็นเชื่อมโยงข้อเสนอกับสถานะความรู้ (หรือการขาดความรู้) ของตนเอง
    - เช่น $P(\text{ผีในช่อง } [3,2]) = 0.02$

## Frequentism vs. Bayesianism

ค่าความน่าจะเป็นแสดงถึงอะไร?
- มุมมองของ *frequentist* ที่เป็นรูปธรรมคือ ความน่าจะเป็นเป็นแง่มุมที่แท้จริงของจักรวาล
    - กล่าวคือ แนวโน้มของวัตถุที่จะมีพฤติกรรมในลักษณะบางอย่าง
    - เช่น การที่เหรียญเที่ยงตรงจะออกหัวด้วยความน่าจะเป็น $0.5$ เป็นแนวโน้มของเหรียญเอง
- มุมมองของ **Bayesian** ที่เป็นอัตวิสัยคือ ความน่าจะเป็นเป็นวิธีบ่งบอกความเชื่อหรือความไม่แน่นอนของเอเจนต์
    - กล่าวคือ ความน่าจะเป็นไม่มีนัยสำคัญทางกายภาพภายนอก
    - นี่คือการตีความความน่าจะเป็นที่เราจะใช้!

.question[เราจะกำหนดค่าตัวเลขให้กับความเชื่อได้อย่างไร?]

# สัจพจน์ของคอลโมโกรอฟ (Kolmogorov's axioms)

เริ่มต้นด้วยเซต $\Omega$ ซึ่งคือ **ปริภูมิตัวอย่าง (sample space)**

$\omega \in \Omega$ คือ *จุดตัวอย่าง (sample point)* หรือโลกที่เป็นไปได้

**ปริภูมิความน่าจะเป็น (probability space)** คือปริภูมิตัวอย่างที่มีฟังก์ชันความน่าจะเป็นติดตั้งอยู่ด้วย กล่าวคือ การกำหนดค่า $P : \mathcal{P}(\Omega) \to \mathbb{R}$ โดยที่:
- สัจพจน์ข้อที่ 1: $P(\omega) \in \mathbb{R}$, $0 \leq P(\omega)$ สำหรับทุก $\omega \in \Omega$
- สัจพจน์ข้อที่ 2: $P(\Omega) = 1$
- สัจพจน์ข้อที่ 3: $P(\\{ \omega\_1, ..., \omega\_n \\}) = \sum\_{i=1}^n P(\omega\_i)$ สำหรับเซตของตัวอย่างใดๆ

โดยที่ $\mathcal{P}(\Omega)$ คือเพาเวอร์เซตของ $\Omega$

???

สัจพจน์เหล่านี้จำกัดระดับความเชื่อที่เอเจนต์สามารถมีเกี่ยวกับข้อเสนอที่มีความสัมพันธ์กันในเชิงตรรกะ

ทฤษฎีบทของ De Finetti บอกเป็นนัยว่า ไม่มีเอเจนต์ที่มีเหตุผลใดสามารถมีความเชื่อที่ขัดต่อสัจพจน์ของความน่าจะเป็นได้ หรือพูดอีกอย่างก็คือ ความเชื่อที่มีเหตุผลต้องปฏิบัติตามสัจพจน์ของความน่าจะเป็น

$P$ สามารถเป็นสากล (Frequentist) หรือเป็นอัตวิสัย (Bayesian) ก็ได้ มันเป็นทางเลือกที่เราต้องตัดสินใจ และยังสามารถกำหนดพารามิเตอร์แล้วเรียนรู้จากข้อมูลได้อีกด้วย (บรรยาย 5 และ 7)

class: middle

## ตัวอย่าง

- $\Omega$ = ผลลัพธ์ที่เป็นไปได้ 6 อย่างจากการทอยลูกเต๋า
- $\omega\_i$ (สำหรับ $i=1, ..., 6$) คือจุดตัวอย่าง ซึ่งแต่ละจุดสอดคล้องกับผลลัพธ์ของลูกเต๋า
- การกำหนดค่า $P$ สำหรับลูกเต๋าที่เที่ยงตรง:
$$P(1) = P(2) = P(3) = P(4) = P(5) = P(6) = \frac{1}{6}$$

---

# ตัวแปรสุ่ม (Random variables)

- **ตัวแปรสุ่ม (random variable)** คือฟังก์ชัน $X: \Omega \to D\_X$ จากปริภูมิตัวอย่างไปยังโดเมนบางอย่างที่กำหนดผลลัพธ์ของมัน
    - เช่น $\text{Odd}: \Omega \to \\{ \text{true}, \text{false} \\}$ โดยที่ $\text{Odd}(\omega) = (\omega\,\text{mod}\,2 = 1)$
- $P$ ก่อให้เกิด *การแจกแจงความน่าจะเป็น (probability distribution)* สำหรับตัวแปรสุ่ม $X$ ใดๆ
    - $P(X=x\_i) = \sum\_{\\{\omega: X(\omega)=x\_i\\}} P(\omega)$
    - เช่น $P(\text{Odd}=\text{true}) = P(1)+P(3)+P(5) = \frac{1}{2}$
- *เหตุการณ์ (event)* $E$ คือเซตของผลลัพธ์ $\\{(x\_1, ..., x\_n), ...\\}$ ของตัวแปร $X\_1, ..., X\_n$ โดยที่ $$P(E) = \sum_{(x_1, ..., x_n) \in E} P(X\_1=x_1, ..., X\_n=x_n)$$

???

ในทางปฏิบัติ เราจะใช้ตัวแปรสุ่มเพื่อแสดงแง่มุมต่างๆ ของโลกที่เรา (อาจ) มีความไม่แน่นอน
- $R$: ฝนตกหรือไม่?
- $T$: อากาศร้อนหรือเย็น?
- $L$: ผีอยู่ที่ไหน?

---

class: middle

## สัญกรณ์ (Notations)

- ตัวแปรสุ่มจะเขียนด้วยอักษรโรมันตัวใหญ่: $X$, $Y$, ฯลฯ
- การปรากฏ (realization) ของตัวแปรสุ่มจะเขียนด้วยอักษรตัวเล็กที่สอดคล้องกัน
   เช่น $x\_1$, $x\_2$, ..., $x\_n$ อาจเป็นผลลัพธ์ของตัวแปรสุ่ม $X$
- ค่าความน่าจะเป็นของการปรากฏ $x$ จะเขียนเป็น $P(X=x)$
- เมื่อชัดเจนจากบริบท จะย่อเป็น $P(x)$
- การแจกแจงความน่าจะเป็นของตัวแปรสุ่ม (แบบไม่ต่อเนื่อง) $X$ จะเขียนแทนด้วย ${\bf{P}}(X)$ ซึ่งสอดคล้องกับเวกเตอร์ของตัวเลข โดยแต่ละตัวสำหรับค่าความน่าจะเป็น $P(X=x\_i)$ (และไม่ใช่ค่าสเกลาร์ค่าเดียว!)

---

# การแจกแจงความน่าจะเป็น (Probability distributions)

สำหรับตัวแปรแบบไม่ต่อเนื่อง **การแจกแจงความน่าจะเป็น** สามารถเข้ารหัสได้ด้วยรายการของความน่าจะเป็นของผลลัพธ์ต่างๆ หรือที่เรียกว่า *ฟังก์ชันมวลของความน่าจะเป็น (probability mass function)*

## การแจกแจงร่วม (Joint distributions)

**การแจกแจงความน่าจะเป็นร่วม (joint probability distribution)** ของชุดตัวแปรสุ่ม $X_1, ..., X_n$ จะระบุความน่าจะเป็นของแต่ละผลลัพธ์ (ที่รวมกัน):

$$P(X\_1=x\_1, ..., X\_n=x\_n) = \sum\_{\\{\omega: X\_1(\omega)=x\_1, ..., X\_n(\omega)=x\_n\\}} P(\omega)$$

<br>

.center[${\bf P}(T,W)$]

| $T$ | $W$ | $P$ |
| --- | --- | --- |
| $\text{hot}$ | $\text{sun}$ | $0.4$ |
| $\text{hot}$ | $\text{rain}$ | $0.1$ |
| $\text{cold}$ | $\text{sun}$ | $0.2$ |
| $\text{cold}$ | $\text{rain}$ | $0.3$ |

- ความน่าจะเป็นที่อากาศจะร้อนและมีแดด?
- ความน่าจะเป็นที่อากาศจะร้อน?

เหตุการณ์ที่น่าสนใจมักจะสอดคล้องกับ **การกำหนดค่าบางส่วน (partial assignments)** เช่น $P(\text{hot})$

## การแจกแจงมีเงื่อนไข (Conditional distributions)

**ความน่าจะเป็นมีเงื่อนไข (conditional probability)** ของการปรากฏ $a$ เมื่อกำหนดให้มีการปรากฏ $b$ ถูกนิยามว่าเป็นอัตราส่วนของความน่าจะเป็นของการปรากฏร่วมกันของ $a$ และ $b$ ต่อความน่าจะเป็นของ $b$:
$$P(a|b) = \frac{P(a,b)}{P(b)}.$$

แท้จริงแล้ว การสังเกต $B=b$ จะตัดโลกที่เป็นไปได้ทั้งหมดที่ $B \neq b$ ออกไป เหลือเพียงเซตที่มีความน่าจะเป็นรวมเป็น $P(b)$ ภายในเซตนั้น โลกที่ $A=a$ จะสอดคล้องกับ $A=a \wedge B=b$ และคิดเป็นสัดส่วน $P(a,b)/ P(b)$

# การอนุมานเชิงความน่าจะเป็น (Probabilistic inference)

**การอนุมาน** เชิงความน่าจะเป็นคือปัญหาของการคำนวณความน่าจะเป็นที่ต้องการจากความน่าจะเป็นอื่นที่ทราบค่าอยู่แล้ว (เช่น การคำนวณความน่าจะเป็นมีเงื่อนไขจากการแจกแจงร่วม)

- โดยทั่วไปเราจะคำนวณความน่าจะเป็นมีเงื่อนไข
    - เช่น $P(\text{ตรงเวลา} | \text{ไม่มีรายงานอุบัติเหตุ}) = 0.9$
    - สิ่งเหล่านี้แสดงถึง *ความเชื่อ* ของเอเจนต์เมื่อพิจารณาจากหลักฐาน
- ความน่าจะเป็นเปลี่ยนแปลงไปตามหลักฐานใหม่:
    - เช่น $P(\text{ตรงเวลา} | \text{ไม่มีรายงานอุบัติเหตุ}, \text{5AM}) = 0.95$
    - เช่น $P(\text{ตรงเวลา} | \text{ไม่มีรายงานอุบัติเหตุ}, \text{ฝนตก}) = 0.8$
    - เช่น $P(\text{ผีในช่อง } [3,2] | \text{สีแดงในช่อง } [3,2]) = 0.99$
    - การสังเกตหลักฐานใหม่ทำให้ *ความเชื่อถูกปรับปรุง*

## กรณีทั่วไป
- *ตัวแปรหลักฐาน* (Evidence variables): $E_1, ..., E_k = e_1, ..., e_k$
- *ตัวแปรที่ต้องการหา* (Query variables): $Q$
- *ตัวแปรซ่อนเร้น* (Hidden variables): $H_1, ..., H_r$
- $(Q \cup E_1, ..., E_k \cup H_1, ..., H_r)$ = ตัวแปรทั้งหมด $X_1, ..., X_n$

**การอนุมาน (Inference)** คือปัญหาของการคำนวณ **${\bf P}(Q|e_1, ..., e_k)$**

---

# การอนุมานโดยการแจกแจง (Inference by enumeration)

เริ่มต้นจากการแจกแจงร่วม ${\bf P}(Q, E\_1, ..., E\_k, H\_1, ..., H\_r)$

1.  เลือกรายการที่สอดคล้องกับหลักฐาน $E_1, ..., E_k = e_1, ..., e_k$
2.  กำจัดตัวแปรซ่อนเร้นออกไปโดยการหาผลรวม (Marginalize out) เพื่อให้ได้การแจกแจงร่วมของตัวแปรที่ต้องการหากับตัวแปรหลักฐาน:
    $${\bf P}(Q,e\_1,...,e\_k) = \sum\_{h\_1, ..., h\_r} {\bf P}(Q, h\_1, ..., h\_r, e\_1, ..., e\_k)$$
3.  ทำให้เป็นมาตรฐาน (Normalize):
    <br>
    $$\begin{aligned}
    Z &= \sum_q P(q,e_1,...,e_k) \\
    {\bf P}(Q|e_1, ..., e_k) &= \frac{1}{Z} {\bf P}(Q,e_1,...,e_k)
    \end{aligned}$$

## ความซับซ้อน (Complexity)

- การอนุมานโดยการแจกแจงสามารถใช้ตอบคำถามเชิงความน่าจะเป็นสำหรับ *ตัวแปรแบบไม่ต่อเนื่อง* (คือ มีจำนวนค่าจำกัด)
- อย่างไรก็ตาม การแจกแจง **ไม่สามารถขยายขนาดได้ (does not scale)**!
    - สมมติว่าโดเมนถูกอธิบายด้วยตัวแปร $n$ ตัว ซึ่งแต่ละตัวมีค่าได้ไม่เกิน $d$ ค่า
    - ความซับซ้อนด้านพื้นที่ (Space complexity): $O(d^n)$
    - ความซับซ้อนด้านเวลา (Time complexity): $O(d^n)$

# กฎลูกโซ่ (Chain rule)

โดยทั่วไปแล้ว การแจกแจงร่วมใดๆ สามารถเขียนเป็นผลคูณของความน่าจะเป็นมีเงื่อนไขที่เพิ่มขึ้นทีละขั้นได้เสมอ:

$$
\begin{aligned}
P(x\_1,x\_2,x\_3) &= P(x\_1)P(x\_2|x\_1)P(x\_3|x\_1,x\_2) \\
P(x\_1,...,x\_n) &= \prod\_{i=1}^n P(x\_i | x\_1, ..., x\_{i-1})
\end{aligned}
$$

- $P(a|b) = P(a)$, หรือ
- $P(b|a) = P(b)$, หรือ
- $P(a,b) = P(a)P(b)$

# ความเป็นอิสระมีเงื่อนไข (Conditional independence)

$A$ และ $B$ เป็น **อิสระมีเงื่อนไข (conditionally independent)** ต่อกันเมื่อกำหนด $C$ ก็ต่อเมื่อ สำหรับทุก $a \in D_A$, $b \in D_B$ และ $c \in D_C$,
- $P(a|b,c) = P(a|c)$, หรือ
- $P(b|a,c) = P(b|c)$, หรือ
- $P(a,b|c) = P(a|c)P(b|c)$

ความเป็นอิสระมีเงื่อนไขเขียนแทนด้วย $A \perp B | C$

สมมติตัวแปรสุ่มสามตัว $\text{Toothache}$ (ปวดฟัน), $\text{Catch}$ (ตรวจพบค้น) และ $\text{Cavity}$ (ฟันผุ)

ดังนั้น เราสามารถเขียนได้ว่า:

$$
\begin{aligned}
&P(\text{toothache}, \text{catch}, \text{cavity}) \\
&= P(\text{toothache}|\text{catch}, \text{cavity}) P(\text{catch}|\text{cavity}) P(\text{cavity}) \\
&= P(\text{toothache}|\text{cavity}) P(\text{catch}|\text{cavity}) P(\text{cavity})
\end{aligned}
$$

ในกรณีนี้ การนำเสนอการแจกแจงร่วมจะลดลงเหลือตัวเลขที่ไม่ขึ้นต่อกัน $2+2+1$ ตัว (แทนที่จะเป็น $2^n-1$)

## ตัวอย่างที่ 2 (Naive Bayes)

โดยทั่วไป จากกฎผลคูณ เราจะได้
$$P(\text{cause},\text{effect}_1, ..., \text{effect}_n) = P(\text{effect}_1, ..., \text{effect}_n|\text{cause}) P(\text{cause})$$

เมื่อสมมติ *ความเป็นอิสระมีเงื่อนไขแบบจับคู่ (pairwise conditional independence)* ระหว่างผลกระทบ (effects) เมื่อกำหนดสาเหตุ (cause) จะได้ว่า:
$$P(\text{cause},\text{effect}_1, ..., \text{effect}_n) = P(\text{cause}) \prod_i P(\text{effect}_i|\text{cause}) $$

แบบจำลองความน่าจะเป็นนี้เรียกว่าแบบจำลอง **Naive Bayes**
- ความซับซ้อนของแบบจำลองนี้คือ $O(n)$ แทนที่จะเป็น $O(2^n)$ หากไม่มีสมมติฐานความเป็นอิสระมีเงื่อนไข
- Naive Bayes สามารถทำงานได้ดีอย่างน่าประหลาดใจในทางปฏิบัติ แม้ว่าสมมติฐานจะไม่ถูกต้องก็ตาม

## ตัวอย่างที่ 1: ความน่าจะเป็นเชิงวินิจฉัยจากความน่าจะเป็นเชิงสาเหตุ

$$P(\text{cause}|\text{effect}) = \frac{P(\text{effect}|\text{cause})P(\text{cause})}{P(\text{effect})}$$
โดยที่
- $P(\text{effect}|\text{cause})$ วัดปริมาณความสัมพันธ์ในทิศทาง *เชิงสาเหตุ (causal)*
- $P(\text{cause}|\text{effect})$ อธิบายทิศทาง **เชิงวินิจฉัย (diagnostic)**

ให้ $S$=คอแข็ง และ $M$=เยื่อหุ้มสมองอักเสบ
กำหนดให้ $P(s|m) = 0.7$, $P(m) = 1/50000$, $P(s) = 0.01,$
จะได้
$$P(m|s) = \frac{P(s|m)P(m)}{P(s)} = \frac{0.7 \times 1/50000}{0.01} = 0.0014$$

## ตัวอย่างที่ 2: Ghostbusters, ทบทวนอีกครั้ง

- สมมติตัวแปรสุ่ม $G$ สำหรับตำแหน่งของผี และชุดของตัวแปรสุ่ม $R_{i,j}$ สำหรับค่าที่อ่านได้แต่ละค่า
- เราเริ่มต้นด้วย **การแจกแจงก่อนหน้า (prior distribution)** ที่เป็นเอกรูป (uniform) ${\bf P}(G)$ สำหรับตำแหน่งของผี
- เราสมมติแบบจำลองการอ่านของเซ็นเซอร์ *reading model* ${\bf P}(R\_{i,j}|G)$
    - นั่นคือ เรารู้ว่าเซ็นเซอร์ทำงานอย่างไร
    - $R_{i,j}$ = สีที่อ่านได้ ณ ตำแหน่ง $[i,j]$
        - เช่น $P(R_{1,1}=\text{yellow}|G=[1,1])=0.1$
    - ค่าที่อ่านได้สองค่าเป็นอิสระมีเงื่อนไขต่อกัน เมื่อกำหนดตำแหน่งของผี

- เราสามารถคำนวณ **การแจกแจงภายหลัง (posterior distribution)** ${\bf P}(G|R\_{i,j})$ โดยใช้กฎของเบย์:
$${\bf P}(G|R\_{i,j}) = \frac{ {\bf P}(R\_{i,j}|G){\bf P}(G)}{ {\bf P}(R\_{i,j})}$$
- สำหรับการอ่านค่าครั้งต่อไป $R\_{i',j'}$ การแจกแจงภายหลังนี้จะกลายเป็นการแจกแจงก่อนหน้าสำหรับตำแหน่งของผี ซึ่งเราจะปรับปรุงในทำนองเดียวกัน
